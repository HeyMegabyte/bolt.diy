<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ProjectSites</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <header class="popup__header">
        <span class="popup__brand-dot" aria-hidden="true"></span>
        <h1 class="popup__title">ProjectSites</h1>
      </header>
      <section class="popup__body">
        <p class="popup__url" id="current-url" title="Loading…">Loading…</p>
        <button id="clone-btn" type="button" class="popup__cta">
          Clone this page
        </button>
        <p class="popup__hint">Or press <kbd>⌘⇧P</kbd> on any tab.</p>
      </section>
      <footer class="popup__footer">
        <button id="options-btn" type="button" class="popup__link">
          Settings
        </button>
        <a href="https://projectsites.dev" target="_blank" rel="noopener" class="popup__link">
          projectsites.dev ↗
        </a>
      </footer>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
