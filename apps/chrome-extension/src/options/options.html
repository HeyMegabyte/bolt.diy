<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ProjectSites — Settings</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="settings">
      <h1>ProjectSites extension settings</h1>
      <fieldset>
        <legend>Behavior</legend>
        <label class="row">
          <input type="checkbox" id="fab-enabled" checked />
          Show the floating "Clone with ProjectSites" button on every page
        </label>
        <label class="row">
          <input type="checkbox" id="autoopen-enabled" checked />
          Auto-open the build progress page after cloning
        </label>
      </fieldset>
      <fieldset>
        <legend>Account</legend>
        <p>
          Sign in to associate cloned sites with your ProjectSites workspace:
          <a href="https://projectsites.dev/signin" target="_blank" rel="noopener">Sign in ↗</a>
        </p>
      </fieldset>
      <button id="save" type="button">Save</button>
      <p id="status" class="status" aria-live="polite"></p>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
