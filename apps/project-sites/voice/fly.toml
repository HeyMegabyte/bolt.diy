# =============================================================================
# projectsites-voice — Fly.io app config
# Scale-to-zero when idle; spins up on the first inbound Twilio WS connection.
# =============================================================================

app = "projectsites-voice"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  STT_PROVIDER = "deepgram"
  TTS_PROVIDER = "elevenlabs"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.concurrency]]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
