# Durable Object migrations (item #61). SiteBuilderContainer stays on the
# non-SQLite (classic) storage backend because it runs container instances
# rather than querying. TraceHub + ActivityHub move to the SQLite backend
# (GA April 2025, paid since Jan 2026) so they can use this.ctx.storage.sql.
# [[env.production.migrations]] block intentionally omitted.

# Pulse Inbox — REMOVED from UI/code 2026-05-25. Class kept as a 410-stub
# at `src/durable_objects/conversation_hub.ts` so the existing
# v_conversation_hub migration tag stays consistent. To hard-delete later:
# (1) confirm no live DO instances need data, (2) ship a separate deploy
# with `deleted_classes = ["ConversationHub"]` migration tag, (3) delete
# the stub file + binding below.
# [[env.production.migrations]]
# tag = "v_conversation_hub"
# new_sqlite_classes = ["ConversationHub"]
# TraceHub + ActivityHub + SiteBuilderContainer were already deployed under
# the legacy classic-Durable-Object storage backend in a prior `wrangler
# deploy`. Cloudflare's 10074 error blocks in-place class migrations once
# DOs depend on them. Two paths forward:
#   1. Rename the classes to `TraceHubV2` / `ActivityHubV2`, add them via
#      `new_sqlite_classes`, swap bindings, leave legacy data behind.
#   2. Keep the existing classes on legacy storage; the DO class code
#      feature-detects `ctx.storage.sql` and falls back to legacy KV.
# Path (2) is wired today via the runtime guard inside
# `src/durable_objects/trace_hub.ts` — both code paths exist, the legacy
# branch runs in prod, the SQLite branch lights up after rename.

[env.production.observability]
enabled = true
head_sampling_rate = 0.1

[env.production.observability.logs]
enabled = true
head_sampling_rate = 0.1
invocation_logs = true

[env.production.observability.traces]
enabled = true
head_sampling_rate = 0.1

[[env.production.kv_namespaces]]
binding = "CACHE_KV"
id = "d4f48d52fbe14ccd884ea6dd368568ba"

[[env.production.kv_namespaces]]
binding = "PROMPT_STORE"
id = "5ab9b9509a0741f5a76a6f5c97d7c709"

[[env.production.d1_databases]]
binding = "DB"
database_name = "project-sites-db-production"
database_id = "ea3e839a-c641-4861-ae30-dfc63bff8032"

[[env.production.r2_buckets]]
binding = "SITES_BUCKET"
bucket_name = "project-sites-production"

# Workers for Platforms: user-uploaded AI endpoints (kind='worker') are
# dispatched into this namespace. Created automatically by Part 2 setup.
[[env.production.dispatch_namespaces]]
binding = "USER_DISPATCH"
namespace = "project-sites-endpoints"

# Cron triggers:
#   * * * * *    — Pulse Social due-post sweep (every minute, capped 25/run)
#   */5 * * * *  — no-op (was inbox snooze-resume sweep, removed 2026-05-25)
#   */30 * * * * — verify hostnames + unstick stuck builds
#   0 * * * *    — Drive re-sync + Pulse Social hourly analytics poll
#   0 14 * * 1   — Mon 14:00 UTC (9 AM ET) weekly summary digest emails (#96)
#   0 6 * * *    — daily snapshot metrics backfill (any snapshot <7d old missing metrics)
[env.production.triggers]
crons = ["* * * * *", "*/5 * * * *", "*/30 * * * *", "0 * * * *", "0 14 * * 1", "0 6 * * *"]

# Uncomment when Queues is enabled on the Cloudflare account
# [[env.production.queues.producers]]
# binding = "QUEUE"
# queue = "project-sites-workflows-production"

# [[env.production.queues.consumers]]
# queue = "project-sites-workflows-production"
# max_batch_size = 10
# max_retries = 3

# ─── Voice + SMS Agent (Twilio) ──────────────────────────────
# Required secrets (set with `wrangler secret put --env production`):
#   TWILIO_ACCOUNT_SID      — AC… account SID
#   TWILIO_AUTH_TOKEN       — signs REST calls + verifies inbound webhooks
#   TWILIO_API_KEY          — SK… key SID for client Access Tokens
#   TWILIO_API_SECRET       — paired secret for JWT signing
#   TWILIO_TWIML_APP_SID    — AP… application SID for outgoing voice
#   DEEPGRAM_API_KEY        — optional, low-latency STT (falls back to Whisper)
#   ELEVENLABS_API_KEY      — optional, TTS (falls back to Twilio <Say> on empty bytes)
#
# ─── VOICE BROWSE AGENT (uncomment when DO + Dockerfile exist) ─────────────
# [[env.production.durable_objects.bindings]]
# name = "VOICE_BROWSE_AGENT"
# class_name = "VoiceBrowseAgent"
# [[env.production.containers]]
# class_name = "VoiceBrowseAgent"
# image = "./Dockerfile.voice-browse"
# instance_type = "standard"
# max_instances = 50
# [[env.production.migrations]]
# tag = "v18-voice-browse-agent"
# new_sqlite_classes = ["VoiceBrowseAgent"]
