[[env.production.durable_objects.bindings]]
name = "SITE_BUILDER"
class_name = "SiteBuilderContainer"

[[env.production.durable_objects.bindings]]
name = "TRACE_HUB"
class_name = "TraceHub"

[[env.production.durable_objects.bindings]]
name = "ACTIVITY_HUB"
class_name = "ActivityHub"

[[env.production.durable_objects.bindings]]
name = "APP_RUNTIME"
class_name = "AppRuntimeContainer"

# Pulse Inbox — REMOVED from UI/code 2026-05-25. Binding kept active +
# pointing at a 410-stub class (`src/durable_objects/conversation_hub.ts`)
