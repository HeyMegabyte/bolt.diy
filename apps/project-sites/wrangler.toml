#:schema node_modules/wrangler/config-schema.json
name = "project-sites"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]
send_metrics = false

# ─── Observability ───────────────────────────────────────────
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

[observability.traces]
enabled = true
head_sampling_rate = 1

# ─── KV Namespace for caching ────────────────────────────────
[[kv_namespaces]]
binding = "CACHE_KV"
id = "dc6e00fd0de94cc3afc2c6c774347312"

# ─── KV for prompt hotfixes (optional override of bundled prompts) ─
[[kv_namespaces]]
binding = "PROMPT_STORE"
id = "c74012c6439e403487ece3f66b6f1362"

# ─── D1 Database ─────────────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "project-sites-db"
database_id = "f5b59818-c785-4807-8aca-282c9037c58c"

# ─── R2 Bucket for static site output ────────────────────────
[[r2_buckets]]
binding = "SITES_BUCKET"
bucket_name = "project-sites"

# ─── Queue producer for workflow jobs ─────────────────────────
# Uncomment when Queues is enabled on the Cloudflare account
# [[queues.producers]]
# binding = "QUEUE"
# queue = "project-sites-workflow"

# ─── Queue consumer ──────────────────────────────────────────
# [[queues.consumers]]
# queue = "project-sites-workflow"
# max_batch_size = 10
# max_retries = 3

# ─── Cloudflare Workflow for AI site generation ────────────────
[[workflows]]
name = "site-generation-workflow"
binding = "SITE_WORKFLOW"
class_name = "SiteGenerationWorkflow"

# ─── AI binding for Cloudflare Workers AI ─────────────────────
[ai]
binding = "AI"

# ─── Production ──────────────────────────────────────────────
[env.production]
name = "project-sites"
workers_dev = true
routes = [
  { pattern = "projectsites.dev", custom_domain = true },
  { pattern = "*.projectsites.dev/*", zone_name = "projectsites.dev" }
]

[env.production.vars]
ENVIRONMENT = "production"
INTERNAL_CALLBACK_URL = "https://project-sites.manhattan.workers.dev/api/internal/build-status"
# Cloudflare auto-config (Part 2 of the admin overhaul brief). CF_API_TOKEN
# is a secret; CF_ACCOUNT_ID + WFP_NAMESPACE_NAME stay in vars because
# they're not sensitive and the dispatch binding below pins this namespace.
CF_ACCOUNT_ID = "84fa0d1b16ff8086dd958c468ce7fd59"
WFP_NAMESPACE_NAME = "project-sites-endpoints"
# Sentry release tracking (item #48). Override per deploy with
#   wrangler deploy --env production --var SENTRY_RELEASE:$(git rev-parse --short HEAD)
# so the version matches the sourcemaps uploaded by
# scripts/upload-sentry-sourcemaps.mjs. The placeholder below keeps the
# binding present even on hand-rolled deploys.
SENTRY_RELEASE = "project-sites@dev"

[[env.production.workflows]]
name = "site-generation-workflow-production"
binding = "SITE_WORKFLOW"
class_name = "SiteGenerationWorkflow"

# Workflows v2: resumable Google Drive ingest pipeline (item #60).
# Replaces the inline syncDriveFolder + hourly cron synchronous path.
[[env.production.workflows]]
name = "drive-sync-workflow-production"
binding = "DRIVE_SYNC_WORKFLOW"
class_name = "DriveSyncWorkflow"

# Workflows v2: resumable AI image generation with DALL-E → Stability
# fallback (item #60). Replaces the synchronous generateSectionImage path
# inside the build pipeline.
[[env.production.workflows]]
name = "image-generation-workflow-production"
binding = "IMAGE_GENERATION_WORKFLOW"
class_name = "ImageGenerationWorkflow"

[env.production.ai]
binding = "AI"

# Workers Analytics Engine — admin dashboard visit tracker.
# Powers the Analytics page (queried via the SQL API).
[[env.production.analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "projectsites_admin_v1"

# Claude Code build container — custom image with Claude Code + skills + template pre-baked
# standard-4 = 4 vCPU, 12 GiB RAM, 8 GB disk. Larger size accelerates parallel prompt execution.
[[env.production.containers]]
class_name = "SiteBuilderContainer"
image = "./Dockerfile"
max_instances = 10
instance_type = "standard-4"

[[env.production.durable_objects.bindings]]
name = "SITE_BUILDER"
class_name = "SiteBuilderContainer"

[[env.production.durable_objects.bindings]]
name = "TRACE_HUB"
class_name = "TraceHub"

[[env.production.durable_objects.bindings]]
name = "ACTIVITY_HUB"
class_name = "ActivityHub"

# Durable Object migrations (item #61). SiteBuilderContainer stays on the
# non-SQLite (classic) storage backend because it runs container instances
# rather than querying. TraceHub + ActivityHub move to the SQLite backend
# (GA April 2025, paid since Jan 2026) so they can use this.ctx.storage.sql.
# [[env.production.migrations]] block intentionally omitted.
# TraceHub + ActivityHub + SiteBuilderContainer were already deployed under
# the legacy classic-Durable-Object storage backend in a prior `wrangler
# deploy`. Cloudflare's 10074 error blocks in-place class migrations once
# DOs depend on them. Two paths forward:
#   1. Rename the classes to `TraceHubV2` / `ActivityHubV2`, add them via
#      `new_sqlite_classes`, swap bindings, leave legacy data behind.
#   2. Keep the existing classes on legacy storage; the DO class code
#      feature-detects `ctx.storage.sql` and falls back to legacy KV.
# Path (2) is wired today via the runtime guard inside
# `src/durable_objects/trace_hub.ts` — both code paths exist, the legacy
# branch runs in prod, the SQLite branch lights up after rename.

[env.production.observability]
enabled = true
head_sampling_rate = 0.1

[env.production.observability.logs]
enabled = true
head_sampling_rate = 0.1
invocation_logs = true

[env.production.observability.traces]
enabled = true
head_sampling_rate = 0.1

[[env.production.kv_namespaces]]
binding = "CACHE_KV"
id = "d4f48d52fbe14ccd884ea6dd368568ba"

[[env.production.kv_namespaces]]
binding = "PROMPT_STORE"
id = "5ab9b9509a0741f5a76a6f5c97d7c709"

[[env.production.d1_databases]]
binding = "DB"
database_name = "project-sites-db-production"
database_id = "ea3e839a-c641-4861-ae30-dfc63bff8032"

[[env.production.r2_buckets]]
binding = "SITES_BUCKET"
bucket_name = "project-sites-production"

# Workers for Platforms: user-uploaded AI endpoints (kind='worker') are
# dispatched into this namespace. Created automatically by Part 2 setup.
[[env.production.dispatch_namespaces]]
binding = "USER_DISPATCH"
namespace = "project-sites-endpoints"

# Cron triggers:
#   */30 * * * * — verify hostnames + unstick stuck builds
#   0 * * * *    — re-sync every connected Google Drive folder for AI chat context
#   0 14 * * 1   — Mon 14:00 UTC (9 AM ET) weekly summary digest emails (#96)
[env.production.triggers]
crons = ["*/30 * * * *", "0 * * * *", "0 14 * * 1"]

# Uncomment when Queues is enabled on the Cloudflare account
# [[env.production.queues.producers]]
# binding = "QUEUE"
# queue = "project-sites-workflows-production"

# [[env.production.queues.consumers]]
# queue = "project-sites-workflows-production"
# max_batch_size = 10
# max_retries = 3
