name = "projectsites-lago-billing"
main = "worker.ts"
compatibility_date = "2026-07-15"

[[containers]]
class_name = "LagoContainerDO"
image = "./Dockerfile"
max_instances = 5

[[durable_objects.bindings]]
name = "LAGO_CONTAINER"
class_name = "LagoContainerDO"
use_sqlite = true

[[migrations]]
tag = "v1"
new_classes = ["LagoContainerDO"]

[[routes]]
pattern = "billing.projectsites.dev"
custom_domain = true
