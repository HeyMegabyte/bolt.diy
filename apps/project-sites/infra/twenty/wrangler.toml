name = "projectsites-twenty"
main = "worker.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
account_id = "84fa0d1b16ff8086dd958c468ce7fd59"

# crm.projectsites.dev → this container worker. The zone is already on Cloudflare,
# so the custom_domain route provisions the proxied DNS record + edge cert on deploy
# (same mechanism as mail.projectsites.dev/listmonk). An explicit hostname route wins
# deterministically over the *.projectsites.dev/* wildcard on the main worker.
routes = [
  { pattern = "crm.projectsites.dev", custom_domain = true },
]

[observability]
enabled = true

[[containers]]
class_name = "TwentyCrm"
image = "./Dockerfile"
max_instances = 1
instance_type = "standard-4"
name = "projectsites-twenty"

[[durable_objects.bindings]]
name = "TWENTY"
class_name = "TwentyCrm"

# Container-backed DOs MUST use new_sqlite_classes (CF API error 10074 on new_classes).
[[migrations]]
tag = "v1"
new_sqlite_classes = ["TwentyCrm"]

# Secrets to set before/after deploy (wrangler secret put ...):
#   PG_DATABASE_URL   (Neon "Twenty" project — postgresql://...sslmode=require)
#   REDIS_URL         (Upstash — rediss://default:<password>@<host>:6379)
#   APP_SECRET        (openssl rand -base64 32 — signs sessions/tokens)
#   AUTH_GOOGLE_CLIENT_ID      (Google Cloud Console OAuth client — enables Google SSO when set)
#   AUTH_GOOGLE_CLIENT_SECRET  (Google Cloud Console OAuth client secret)
[vars]
