name = "projectsites-langflow"
main = "worker.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
account_id = "84fa0d1b16ff8086dd958c468ce7fd59"

# langflow.projectsites.dev — an explicit host route (NOT custom_domain) to beat the
# main `project-sites` worker's `*.projectsites.dev/*` wildcard. DNS resolves via the
# proxied wildcard CNAME/AAAA already on the zone, so no new DNS record needed.
routes = [
  { pattern = "langflow.projectsites.dev/*", zone_name = "projectsites.dev" },
]

[observability]
enabled = true

[[containers]]
class_name = "LangflowContainerDO"
image = "./Dockerfile"
max_instances = 1
# Langflow is a Python FastAPI app — standard-2 (2 vCPU, 4GiB) should handle
# moderate flow-building usage. standard-4 if needed for heavy multi-user.
instance_type = "standard-2"
name = "projectsites-langflow"

[[durable_objects.bindings]]
name = "LANGFLOW"
class_name = "LangflowContainerDO"

# Container-backed DOs MUST use new_sqlite_classes (CF API error 10074 on new_classes).
[[migrations]]
tag = "v1"
new_sqlite_classes = ["LangflowContainerDO"]

# ── Secrets to set before deploy (wrangler secret put ... --name projectsites-langflow) ──
#   LANGFLOW_SECRET_KEY              get-secret LANGFLOW_SECRET_KEY  (openssl rand -base64 32)
#   LANGFLOW_SUPERUSER               get-secret LANGFLOW_SUPERUSER
#   LANGFLOW_SUPERUSER_PASSWORD      get-secret LANGFLOW_SUPERUSER_PASSWORD
#   LANGFLOW_DATABASE_URL            get-secret LANGFLOW_DATABASE_URL (Neon Postgres, DB `neondb`)
#   LANGFLOW_API_KEY                 get-secret LANGFLOW_API_KEY (Langflow API key for programmatic access)
#   LANGFLOW_REDIS_QUEUE_URL         optional — Upstash Redis (rediss://...)
#   LANGFLOW_STORAGE_ACCESS_KEY_ID   optional — R2 S3 access key
#   LANGFLOW_STORAGE_SECRET_ACCESS_KEY   optional — R2 S3 secret
#   LANGFLOW_STORAGE_BUCKET_NAME     optional — R2 bucket name
#   LANGFLOW_STORAGE_ENDPOINT_URL    optional — R2 S3 endpoint (https://<acct>.r2.cloudflarestorage.com)
