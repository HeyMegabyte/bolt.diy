name = "projectsites-plane"
main = "worker.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
account_id = "84fa0d1b16ff8086dd958c468ce7fd59"

# pm.projectsites.dev (canonical) + pm.megabyte.space (alias) → this Worker → Plane AIO.
# pm.projectsites.dev uses an EXPLICIT host route (not custom_domain): the main `project-sites`
# worker owns `*.projectsites.dev/*`, and a custom_domain LOSES to that wildcard — a more-specific
# `pm.projectsites.dev/*` route WINS (validated mail.projectsites.dev pattern). DNS already
# resolves via the proxied `*.projectsites.dev` AAAA + wildcard edge cert, so no record needed.
routes = [
  { pattern = "pm.projectsites.dev/*", zone_name = "projectsites.dev" },
  { pattern = "pm.megabyte.space", custom_domain = true },
]

[observability]
enabled = true

# Keep the AIO container warm so the celery worker/beat keep draining the CloudAMQP queue —
# CF hibernates idle containers; this re-pokes it every 2 min.
[triggers]
crons = ["*/2 * * * *"]

[vars]
WEB_URL = "https://pm.megabyte.space"

# ── Single Plane AIO container ──
[[containers]]
class_name = "Plane"
image = "./Dockerfile"
max_instances = 1
# Plane AIO idles at ~1.6GiB across its 7 processes (measured locally) — memory is never the
# constraint. The KILLER is vCPU: on standard-2 (1 vCPU) the 7-process boot is so CPU-starved
# that Caddy can't bind :8080 inside the lib's port-ready window → the instance churns →
# "Container crashed while checking for ports". standard-4 (4 vCPU, 12GiB, 20GB) gives the
# boot enough cores to come up — same tier the working langfuse container uses.
instance_type = "standard-4"
name = "projectsites-plane"

[[durable_objects.bindings]]
name = "PLANE"
class_name = "Plane"

# Container-backed DOs MUST use new_sqlite_classes (CF API error 10074 on new_classes).
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Plane"]

# Secrets to set before deploy (wrangler secret put ... --name projectsites-plane):
#   SECRET_KEY              get-secret PLANE_SECRET_KEY
#   DATABASE_URL           get-secret PLANE_DATABASE_URL   (Neon direct, DB `plane`)
#   REDIS_URL              get-secret PLANE_REDIS_URL       (Upstash, TLS)
#   AMQP_URL               get-secret PLANE_AMQP_URL        (CloudAMQP RabbitMQ)
#   S3_ACCESS_KEY_ID       get-secret PLANE_R2_ACCESS_KEY_ID
#   S3_SECRET_ACCESS_KEY   get-secret PLANE_R2_SECRET_ACCESS_KEY
