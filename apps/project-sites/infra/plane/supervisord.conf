[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0

# Django API (gunicorn) — the port CF Container health-checks (8000).
[program:api]
command=/code/bin/docker-entrypoint-api.sh
directory=/code
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# Celery worker — drains the CloudAMQP RabbitMQ queue.
[program:worker]
command=/code/bin/docker-entrypoint-worker.sh
directory=/code
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# Celery beat — scheduled tasks.
[program:beat]
command=/code/bin/docker-entrypoint-beat.sh
directory=/code
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
