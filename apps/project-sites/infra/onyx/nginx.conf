worker_processes auto;
error_log /dev/stderr info;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /dev/stdout main;
    sendfile on;
    keepalive_timeout 65;

    upstream api_backend {
        server 127.0.0.1:8081;
    }

    upstream web_backend {
        server 127.0.0.1:3000;
    }

    upstream mcp_backend {
        server 127.0.0.1:8090;
    }

    server {
        listen 8080;
        server_name _;

        client_max_body_size 50M;

        # Health check with API fallback
        location = /health {
            proxy_pass http://api_backend;
            proxy_intercept_errors on;
            error_page 502 503 504 = @health_fallback;
            proxy_set_header Host $host;
        }

        location @health_fallback {
            return 200 "starting";
        }

        # API routes → FastAPI backend
        location /api/ {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_connect_timeout 10s;
        }

        # MCP server → standalone MCP endpoint (port 8090)
        # Trailing slash strips /mcp prefix so /mcp/health → /health on backend
        location /mcp/ {
            proxy_pass http://mcp_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
        }

        # Exact /mcp redirects to /mcp/
        location = /mcp {
            return 308 /mcp/;
        }

        # Everything else → Next.js web server (handles /auth/login, etc.)
        location / {
            proxy_pass http://web_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
        }
    }
}
