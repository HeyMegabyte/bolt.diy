# Dify API + Worker + Beat — Fly.io
# Uses langgenius/dify-api:1.10.1 for all three process groups.
# Backing services: Neon Postgres + Upstash Redis + Weaviate Cloud + R2
app = "projectsites-dify"
primary_region = "iad"

[build]
dockerfile = "Dockerfile"

[env]
LOG_LEVEL = "INFO"
LOG_FILE = ""
LOG_FORMAT = "%(asctime)s.%(msecs)03d %(levelname)s [%(threadName)s] [%(filename)s:%(lineno)d] - %(message)s"
LOG_DATEFORMAT = "%Y-%m-%d %H:%M:%S"
DIFY_BIND_ADDRESS = "0.0.0.0"
DIFY_PORT = "5001"
GUNICORN_TIMEOUT = "600"
SERVER_WORKER_AMOUNT = "1"
SERVER_WORKER_CONNECTIONS = "5"
MIGRATION_ENABLED = "false"

[[vm]]
cpu_kind = "shared"
cpus = 2
memory_mb = 2048

[processes]
api = "/entrypoint.sh"
worker = "bash -c 'MODE=worker exec /entrypoint.sh'"
beat = "bash -c 'MODE=beat exec /entrypoint.sh'"

[[services]]
protocol = "tcp"
internal_port = 5001
processes = ["api"]

  [[services.ports]]
  port = 80
  handlers = ["http"]

  [[services.ports]]
  port = 443
  handlers = ["tls", "http"]

  [services.http_service]
  internal_port = 5001
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.checks]]
  interval = "15s"
  timeout = "10s"
  grace_period = "60s"
  method = "get"
  path = "/health"
