# Dify Plugin Daemon — Fly.io
# Plugin runtime for Dify. Communicates with API over Fly private network.
app = "projectsites-dify-plugin"

[build]
image = "langgenius/dify-plugin-daemon:0.4.1-local"

[env]
DB_TYPE = "postgresql"
PLUGIN_DAEMON_PORT = "5003"

[[vm]]
cpu_kind = "shared"
cpus = 1
memory_mb = 512

[[services]]
protocol = "tcp"
internal_port = 5003
processes = ["plugin"]

  [[services.ports]]
  port = 80
  handlers = ["http"]

  [services.http_service]
  internal_port = 5003
  force_https = false

[processes]
plugin = "/bin/bash -c /app/entrypoint.sh"
