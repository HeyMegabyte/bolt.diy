app = 'projectsites-nango'
primary_region = 'ewr'

[build]
  image = 'nangohq/nango-server:hosted-0.70.9'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[http_service.checks]]
  interval = '30s'
  timeout = '10s'
  grace_period = '180s'
  method = 'get'
  path = '/'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
