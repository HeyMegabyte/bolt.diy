# fly.toml app configuration file generated for projectsites-nango on 2026-06-29T18:35:30-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'projectsites-nango'
primary_region = 'ewr'

[build]
  image = 'nangohq/nango-server:hosted-0.70.9'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
