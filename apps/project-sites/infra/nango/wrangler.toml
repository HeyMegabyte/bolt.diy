name = "integrations-nango"
main = "worker.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
account_id = "84fa0d1b16ff8086dd958c468ce7fd59"

routes = [
  { pattern = "integrations.projectsites.dev", custom_domain = true },
  { pattern = "integrations.projectsites.dev/*", zone_name = "projectsites.dev" },
]

[observability]
enabled = true

[[containers]]
class_name = "Nango"
image = "./Dockerfile"
max_instances = 1
instance_type = "standard-2"
name = "integrations-nango"

[[durable_objects.bindings]]
name = "NANGO_CONTAINER"
class_name = "Nango"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Nango"]
