name = "projectsites-listmonk"
main = "worker.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
account_id = "84fa0d1b16ff8086dd958c468ce7fd59"

# mail.projectsites.dev → this container worker. The zone is already on Cloudflare,
# so the custom_domain route works on deploy (creates the proxied DNS record + cert).
routes = [
  { pattern = "mail.projectsites.dev", custom_domain = true },
]

[observability]
enabled = true

[[containers]]
class_name = "Listmonk"
image = "./Dockerfile"
max_instances = 1
instance_type = "basic"
name = "projectsites-listmonk"

[[durable_objects.bindings]]
name = "LISTMONK"
class_name = "Listmonk"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Listmonk"]

# Non-secret vars (set PG_* + ADMIN_* + SES_SMTP_* via `wrangler secret put`):
#   wrangler secret put PG_HOST       (Neon pooler host)
#   wrangler secret put PG_USER
#   wrangler secret put PG_PASSWORD
#   wrangler secret put PG_DATABASE
#   wrangler secret put ADMIN_USER
#   wrangler secret put ADMIN_PASSWORD
#   wrangler secret put SES_SMTP_HOST / SES_SMTP_USER / SES_SMTP_PASSWORD  (ADR-0019 relay)
[vars]
PG_PORT = "5432"
