# LiteLLM proxy config for llm.megabyte.space.
# Model creds are read from env (set as wrangler secrets, injected by the Container DO).
#
# ROUTING (Brian 2026-06-27): consumers call ONE entrypoint model — `smart`.
# This pinned LiteLLM digest predates the native `auto_router/adaptive_router`
# (it crash-loops on that config → gateway 1101), so for now `smart` is a fast,
# reliable alias to DeepSeek (tier 2 — "almost everything"). The full complexity
# cascade (trivial→Workers-AI, mid→DeepSeek, advanced→Opus 4.8 w/ GPT-5 backup) lands
# once the image is bumped to a digest that supports adaptive_router — see the
# `smart` block at the bottom for the target config. Opus + GPT stay reachable as
# explicit models so a caller can request advanced reasoning directly today.

model_list:
  # ── tier 3 (frontier) — advanced reasoning ──
  - model_name: opus
    litellm_params:
      model: anthropic/claude-opus-4-8
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: gpt
    litellm_params:
      model: openai/gpt-5
      api_key: os.environ/OPENAI_API_KEY
  # ── tier 2 (mid) — DeepSeek; the default the `smart` entrypoint maps to ──
  - model_name: deepseek
    litellm_params:
      model: deepseek/deepseek-chat
      api_key: os.environ/DEEPSEEK_API_KEY
  # ── single entrypoint Twenty calls. Alias → DeepSeek until adaptive_router lands. ──
  - model_name: smart
    litellm_params:
      model: deepseek/deepseek-chat
      api_key: os.environ/DEEPSEEK_API_KEY

litellm_settings:
  drop_params: true
  num_retries: 2
  request_timeout: 600

router_settings:
  routing_strategy: simple-shuffle
  # Opus's only backup is GPT-5; DeepSeek has none (per directive).
  fallbacks:
    - opus: ["gpt"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
