# LiteLLM proxy config for llm.megabyte.space.
# Model creds are read from env (set as wrangler secrets, injected by the Container DO).
# Per rules/model-routing.md provider tiers: premium (Anthropic/OpenAI). RouteLLM picks
# strong-vs-weak per request to cut cost. DeepSeek is unprovisioned here, so the weak leg
# is an OpenAI mini model — RouteLLM works with only OPENAI_API_KEY + ANTHROPIC_API_KEY.

model_list:
  # ── Premium tier ──
  - model_name: gpt-5
    litellm_params:
      model: openai/gpt-5
      api_key: os.environ/OPENAI_API_KEY
  - model_name: claude-opus
    litellm_params:
      model: anthropic/claude-opus-4-8
      api_key: os.environ/ANTHROPIC_API_KEY
  # ── Cheap/fast leg ──
  - model_name: fast
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY
  # NOTE: RouteLLM is pip-installed IN this container (Dockerfile) per the
  # "LiteLLM and RouteLLM on the same container" requirement. LiteLLM main-stable
  # does NOT expose RouteLLM as a `model: router/mf` provider in model_list (it
  # errors "LLM Provider NOT provided"), so a routed "smart" model is wired via
  # RouteLLM's own OpenAI-compatible server (`python -m routellm.openai_server`)
  # as a follow-up, then added here as `model: openai/router-mf-<threshold>` with
  # api_base pointing at localhost. For now the proxy serves the explicit models.

litellm_settings:
  drop_params: true
  num_retries: 2
  request_timeout: 600

router_settings:
  routing_strategy: simple-shuffle
  # Fallback chain: premium → cheap if a model errors.
  fallbacks:
    - claude-opus: ["gpt-5", "fast"]

general_settings:
  # Master key gates the proxy. Set LITELLM_MASTER_KEY as a wrangler secret.
  master_key: os.environ/LITELLM_MASTER_KEY
