# LiteLLM proxy config for llm.megabyte.space.
# Model creds + DATABASE_URL + REDIS_URL + LITELLM_SALT_KEY arrive via env (wrangler
# secrets injected by the Container DO). Production posture per docs.litellm.ai/docs/proxy/prod.
#
# NATIVE ADAPTIVE ROUTER: consumers call ONE entrypoint — `smart`
# (model: auto_router/adaptive_router) — and LiteLLM's native adaptive_router picks the
# cheapest model whose quality_tier + strengths meet the prompt, biased by quality/cost weights:
#   tier 3 (frontier) → Opus 4.8 + GPT-5  (advanced reasoning; Opus errors fall back to GPT)
#   tier 2 (mid)      → DeepSeek          (almost everything; the cost-leaning default)
# `strengths` MUST be one of: code_generation | code_understanding | technical_design |
#   analytical_reasoning | writing | factual_lookup | general  (else proxy startup crashes).

model_list:
  # ── tier 3 (frontier) — advanced tasks ──
  - model_name: opus
    litellm_params:
      model: anthropic/claude-opus-4-8
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info:
      input_cost_per_token: 0.000005
      output_cost_per_token: 0.000025
      adaptive_router_preferences:
        quality_tier: 3
        strengths: ["analytical_reasoning", "technical_design", "code_generation", "code_understanding"]
  - model_name: gpt
    litellm_params:
      model: openai/gpt-5
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      input_cost_per_token: 0.0000025
      output_cost_per_token: 0.00001
      adaptive_router_preferences:
        quality_tier: 3
        strengths: ["analytical_reasoning", "code_generation", "writing"]
  # ── tier 2 (mid) — almost everything (cost-leaning default) ──
  - model_name: deepseek
    litellm_params:
      model: deepseek/deepseek-chat
      api_key: os.environ/DEEPSEEK_API_KEY
    model_info:
      input_cost_per_token: 0.00000027
      output_cost_per_token: 0.0000011
      adaptive_router_preferences:
        quality_tier: 2
        strengths: ["general", "writing", "factual_lookup"]
  # ── tier 1 (budget) — trivial prompts → Cloudflare Workers AI (Llama 3.3, ~free) ──
  #    The `cloudflare/` provider REQUIRES an explicit api_base = the account's ai/run/
  #    endpoint (LiteLLM appends the @cf/... model). api_key = a Workers-AI-scoped token.
  - model_name: ollama
    litellm_params:
      model: cloudflare/@cf/meta/llama-3.3-70b-instruct-fp8-fast
      api_key: os.environ/CLOUDFLARE_API_KEY
      api_base: https://api.cloudflare.com/client/v4/accounts/84fa0d1b16ff8086dd958c468ce7fd59/ai/run/
    model_info:
      input_cost_per_token: 0.0000001
      output_cost_per_token: 0.0000001
      adaptive_router_preferences:
        quality_tier: 1
        strengths: ["factual_lookup", "general"]
  # ── embeddings (RAG / Vectorize / future semantic cache) ──
  - model_name: embedding
    litellm_params:
      model: openai/text-embedding-3-small
      api_key: os.environ/OPENAI_API_KEY

  # ── arbitration models (CF-native: cheap legs on Workers AI) — projectsites_arbiter.py ──
  # cascade: draft on Workers AI → escalate only if low-confidence (big premium-spend cut).
  # quorum:  fan out opus+gpt+deepseek → Workers-AI judge picks best (metadata.stakes:high).
  - model_name: cascade
    litellm_params:
      model: ps-arbiter/cascade
  - model_name: quorum
    litellm_params:
      model: ps-arbiter/quorum

  # ── the single entrypoint: native adaptive_router across all three tiers ──
  - model_name: smart
    litellm_params:
      model: auto_router/adaptive_router
      adaptive_router_config:
        available_models: ["opus", "gpt", "deepseek", "ollama"]
        weights:
          quality: 0.45
          cost: 0.55

litellm_settings:
  drop_params: true
  num_retries: 3
  request_timeout: 600
  json_logs: true
  # Redis exact-match response cache (dedupe identical prompts → cut spend + latency).
  cache: true
  cache_params:
    type: redis
    redis_url: os.environ/REDIS_URL
    ttl: 600
  # Prometheus /metrics + the ProjectSites meta-LLM hooks pipeline (projectsites_hooks.py).
  # Every hook step is OFF by default (HOOK_<NAME>=1 or per-request metadata.hooks) and
  # fail-open, so mounting it is behaviour-neutral until a flag is flipped.
  callbacks: ["prometheus", "projectsites_hooks.hooks_instance"]
  # CF-native arbitration models (cascade / quorum) — registered before model_list so the
  # `ps-arbiter/*` entries resolve. Cheap legs (draft/confidence/judge) run on Workers AI.
  custom_provider_map:
    - {"provider": "ps-arbiter", "custom_handler": projectsites_arbiter.arbiter_instance}

router_settings:
  routing_strategy: simple-shuffle
  # Shared cooldown / rate-limit state across instances (Upstash Redis).
  redis_url: os.environ/REDIS_URL
  allowed_fails: 3
  cooldown_time: 30
  # Opus's only backup is GPT-5 (advanced tasks); DeepSeek has none (per directive).
  fallbacks:
    - opus: ["gpt"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
  # Batch spend writes every 60s; cap DB pool per worker.
  proxy_batch_write_at: 60
  database_connection_pool_limit: 5
  # Slack alerts: hanging requests, slow responses, budget thresholds (SLACK_WEBHOOK_URL env).
  alerting: ["slack"]
  alerting_threshold: 300
