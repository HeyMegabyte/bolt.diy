name = "projectsites-litellm"
main = "worker.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
account_id = "84fa0d1b16ff8086dd958c468ce7fd59"

# llm.megabyte.space → this container worker. The megabyte.space zone
# (75a6f8d5e441cd7124552976ba894f83) is on the same Cloudflare account, so the
# custom_domain route provisions the proxied DNS record + edge cert on deploy
# (same mechanism as mail.projectsites.dev/listmonk). LiteLLM is the OpenAI-compatible
# /v1 gateway here; the main project-sites worker still serves llm.projectsites.dev.
routes = [
  { pattern = "llm.megabyte.space", custom_domain = true },
]

[observability]
enabled = true

[[containers]]
class_name = "LiteLLM"
image = "./Dockerfile"
max_instances = 1
instance_type = "standard-2"
name = "projectsites-litellm"

[[durable_objects.bindings]]
name = "LITELLM"
class_name = "LiteLLM"

# Container-backed DOs MUST use new_sqlite_classes (CF API error 10074 on new_classes).
[[migrations]]
tag = "v1"
new_sqlite_classes = ["LiteLLM"]

# Secrets to set before deploy (wrangler secret put ... ):
#   LITELLM_MASTER_KEY   (sk-... — gates the proxy; openssl rand -hex 24, prefix sk-)
#   OPENAI_API_KEY  ANTHROPIC_API_KEY  DEEPSEEK_API_KEY   (per provider used)
[vars]
