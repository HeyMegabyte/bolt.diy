name = "projectsites-grafana"
main = "worker.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
account_id = "84fa0d1b16ff8086dd958c468ce7fd59"

# grafana.projectsites.dev → this Worker → Fly.io Grafana (projectsites-grafana.fly.dev).
# EXPLICIT host route: the main `project-sites` worker owns `*.projectsites.dev/*`,
# and a custom_domain LOSES to that wildcard — a more-specific route WINS.
routes = [
  { pattern = "grafana.projectsites.dev/*", zone_name = "projectsites.dev" },
]

workers_dev = true

[observability]
enabled = true

[vars]
GRAFANA_UPSTREAM_URL = "https://projectsites-grafana.fly.dev"
