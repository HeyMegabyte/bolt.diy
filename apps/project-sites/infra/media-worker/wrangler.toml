# projectsites-media — serves the Listmonk media R2 bucket at media.projectsites.dev.
#
# WHY THIS EXISTS: the project-sites Worker owns the wildcard route
# `*.projectsites.dev/*`, which intercepts media.projectsites.dev before an R2
# custom domain can serve it (a Worker route always out-ranks an R2 custom domain).
# Every other subdomain (mail/llm/crm/cms/…) wins with a MORE-SPECIFIC route; this
# is the same pattern for media — a minimal read-only R2 file server.
name = "projectsites-media"
main = "index.ts"
compatibility_date = "2026-06-01"
account_id = "84fa0d1b16ff8086dd958c468ce7fd59"
workers_dev = false

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "projectsites-listmonk-media"

[[routes]]
pattern = "media.projectsites.dev/*"
zone_id = "9ceaa211750dd31899fd5d1bf8d1ec46"
