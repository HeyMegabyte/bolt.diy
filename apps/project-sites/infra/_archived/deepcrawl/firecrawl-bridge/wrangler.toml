name = "projectsites-deepcrawl-firecrawl-bridge"
main = "worker.ts"
compatibility_date = "2025-04-01"
account_id = "84fa0d1b16ff8086dd958c468ce7fd59"

routes = [
  { pattern = "firecrawl-bridge.projectsites.dev", custom_domain = true },
  { pattern = "firecrawl-bridge.projectsites.dev/*", zone_name = "projectsites.dev" },
]

workers_dev = true

[observability]
enabled = true

[vars]
# Point at our deployed v0 API worker
DEEPCRAWL_API_URL = "https://api.deepcrawl.projectsites.dev"

# Secrets (set via wrangler secret put):
#   DEEPCRAWL_API_KEY — optional, for authenticated API access
