# Grafana datasource provisioning — loaded on every container boot.
# Only real, credentialed datasources. Placeholder entries are explicit TODOs.

apiVersion: 1

# Delete any datasources not defined here on each boot (stateless container).
deleteDatasources: []

datasources:
  # Built-in Grafana datasource (testdata) — kept for smoke-testing provisioning
  - name: grafana-testdata
    type: grafana-testdata-datasource
    access: proxy
    isDefault: true
    uid: testdata
    orgId: 1

