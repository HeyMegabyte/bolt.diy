name = "projectsites-medusa"
main = "worker.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
account_id = "84fa0d1b16ff8086dd958c468ce7fd59"

# medusa.projectsites.dev → this Worker → Medusa Container DO.
# Explicit host route beats the main `project-sites` worker's `*.projectsites.dev/*`
# wildcard (validated listmonk/plane pattern).
routes = [
  { pattern = "medusa.projectsites.dev/*", zone_name = "projectsites.dev" },
]

[observability]
enabled = true

# Keep the container warm so admin never cold-starts
[triggers]
crons = ["*/3 * * * *"]

[vars]
MEDUSA_BACKEND_URL = "https://medusa.projectsites.dev"

# ── Medusa Container ──
[[containers]]
class_name = "MedusaContainer"
image = "./Dockerfile"
max_instances = 1
# Medusa + admin build need 2GiB+. standard-1 = 2 vCPU, 8GiB RAM, 20GB disk
instance_type = "standard-1"
name = "projectsites-medusa"

[[durable_objects.bindings]]
name = "MEDUSA"
class_name = "MedusaContainer"

# Container-backed DOs MUST use new_sqlite_classes
[[migrations]]
tag = "v1"
new_sqlite_classes = ["MedusaContainer"]

# Secrets to set before deploy (wrangler secret put ... --name projectsites-medusa):
#   DATABASE_URL            (Neon direct, DB `medusa`)
#   REDIS_URL               (Upstash, rediss://)
#   JWT_SECRET              (openssl rand -hex 32)
#   COOKIE_SECRET           (openssl rand -hex 32)
#   S3_ACCESS_KEY_ID        (R2 API token)
#   S3_SECRET_ACCESS_KEY    (R2 API token secret)
#   S3_ENDPOINT             (https://<account-id>.r2.cloudflarestorage.com)
#   S3_BUCKET               (medusa-media)
#   STRIPE_API_KEY          (optional — sk_test_ for dev)
#   STRIPE_WEBHOOK_SECRET   (optional)
