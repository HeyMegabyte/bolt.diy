name = "projectsites-skyvern"
main = "worker.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
account_id = "84fa0d1b16ff8086dd958c468ce7fd59"

# browser.projectsites.dev → this container worker. At cutover: add an EXPLICIT
# Workers route browser.projectsites.dev/* → projectsites-skyvern (more specific than
# the *.projectsites.dev/* wildcard, which wins — per the listmonk-mail lesson) AND
# remove `browser` from the main worker's system_service_landing map so the status
# page stops answering.
routes = [
  { pattern = "browser.projectsites.dev", custom_domain = true },
]

[observability]
enabled = true

[[containers]]
class_name = "Skyvern"
image = "./Dockerfile"
max_instances = 1
# Chromium-bundled image is heavy — needs the larger instance class.
instance_type = "standard-4"
name = "projectsites-skyvern"

[[durable_objects.bindings]]
name = "SKYVERN"
class_name = "Skyvern"

# Container-backed DOs MUST use new_sqlite_classes (CF API error 10074 on new_classes).
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Skyvern"]

# Secrets to set before deploy (wrangler secret put ...):
#   DATABASE_STRING   (Neon postgresql://... — create a DB in the shared project per
#                      neon-database-conservation; do NOT open a new Neon project)
#   OPENAI_API_KEY and/or ANTHROPIC_API_KEY   (powers the agent)
#   SKYVERN_API_KEY   (bearer for the Skyvern API; openssl rand -hex 24)
[vars]
