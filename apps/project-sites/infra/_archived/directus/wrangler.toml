name = "projectsites-directus"
main = "worker.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
account_id = "84fa0d1b16ff8086dd958c468ce7fd59"

# directus.projectsites.dev → this container worker
routes = [
  { pattern = "directus.projectsites.dev", custom_domain = true },
  { pattern = "directus.projectsites.dev/*", zone_name = "projectsites.dev" },
]
workers_dev = true

[observability]
enabled = true

[[containers]]
class_name = "DirectusContainerDO"
image = "./Dockerfile"
max_instances = 1
instance_type = "standard-1"
name = "projectsites-directus"

[[durable_objects.bindings]]
name = "DIRECTUS_CONTAINER"
class_name = "DirectusContainerDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DirectusContainerDO"]

# ── Vars forwarded into the container ────────────────────────────────────
[vars]
PUBLIC_URL = "https://directus.projectsites.dev"
HOST = "0.0.0.0"
PORT = "8055"
CACHE_ENABLED = "true"
CACHE_AUTO_PURGE = "true"
CACHE_STORE = "redis"
STORAGE_LOCATIONS = "r2"
STORAGE_R2_DRIVER = "s3"
STORAGE_R2_REGION = "auto"
STORAGE_R2_ENDPOINT = "https://84fa0d1b16ff8086dd958c468ce7fd59.r2.cloudflarestorage.com"
STORAGE_R2_BUCKET = "projectsites-directus-assets"
EMAIL_TRANSPORT = "smtp"
EMAIL_SMTP_SECURE = "true"
EMAIL_FROM = "directus@projectsites.dev"

# ── Secrets (all set via wrangler secret put) ────────────────────────────
# SECRET, ADMIN_EMAIL, ADMIN_PASSWORD
# DB_CONNECTION_STRING (pooled Neon URL)
# REDIS (rediss://...)
# STORAGE_R2_KEY, STORAGE_R2_SECRET
# EMAIL_SMTP_HOST, EMAIL_SMTP_PORT, EMAIL_SMTP_USER, EMAIL_SMTP_PASSWORD
