name = "projectsites-n8n"
main = "worker.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
account_id = "84fa0d1b16ff8086dd958c468ce7fd59"

# n8n — WORKFLOW AUTOMATION (APP CATALOG ITEM, NOT PLATFORM INFRA).
# Deployed as customer-name.app.projectsites.dev via the app catalog.
# NO top-level subdomain route — this is a customer-facing app, not platform infra.
# To deploy for a specific customer:
#   1. Copy this directory
#   2. Set routes = [{ pattern = "customer-name.app.projectsites.dev/*", zone_name = "projectsites.dev" }]
#   3. npx wrangler deploy
# Keep warm for now via workers.dev while we test.
# routes = [
#   { pattern = "automations.projectsites.dev/*", zone_name = "projectsites.dev" },
# ]
workers_dev = true

[observability]
enabled = true

[[containers]]
class_name = "N8nContainerDO"
image = "./Dockerfile"
max_instances = 1
instance_type = "basic"
name = "projectsites-n8n"

[[durable_objects.bindings]]
name = "N8N"
class_name = "N8nContainerDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["N8nContainerDO"]

# ── Public URL / routing ──────────────────────────────────────────────────
[vars]
N8N_HOST = "automations.projectsites.dev"
N8N_PROTOCOL = "https"
N8N_PORT = "5678"
WEBHOOK_URL = "https://automations.projectsites.dev/"
N8N_EDITOR_BASE_URL = "https://automations.projectsites.dev/"
N8N_PROXY_HOPS = "1"
NODE_ENV = "production"
GENERIC_TIMEZONE = "America/New_York"
TZ = "America/New_York"

# ── Database (Neon Postgres) ─────────────────────────────────────────────
DB_TYPE = "postgresdb"
DB_POSTGRESDB_PORT = "5432"
DB_POSTGRESDB_DATABASE = "n8n"
DB_POSTGRESDB_SSL_ENABLED = "true"

# ── Queue mode (Upstash Redis) ────────────────────────────────────────────
EXECUTIONS_MODE = "queue"
QUEUE_BULL_REDIS_PORT = "6379"
QUEUE_BULL_REDIS_TLS = "true"

# ── Health / metrics ──────────────────────────────────────────────────────
N8N_METRICS = "true"
QUEUE_HEALTH_CHECK_ACTIVE = "true"

# ── Privacy ───────────────────────────────────────────────────────────────
N8N_DIAGNOSTICS_ENABLED = "false"
N8N_VERSION_NOTIFICATIONS_ENABLED = "false"
N8N_TEMPLATES_ENABLED = "false"

# ── Binary data safety ────────────────────────────────────────────────────
N8N_DEFAULT_BINARY_DATA_MODE = "database"

# ── Execution retention / safety ──────────────────────────────────────────
EXECUTIONS_DATA_PRUNE = "true"
EXECUTIONS_DATA_MAX_AGE = "336"
EXECUTIONS_TIMEOUT = "300"
EXECUTIONS_TIMEOUT_MAX = "3600"
N8N_CONCURRENCY_PRODUCTION_LIMIT = "25"

# ── Community nodes: curated allowlist ────────────────────────────────────
N8N_COMMUNITY_PACKAGES_ENABLED = "true"
N8N_COMMUNITY_PACKAGES_ALLOWLIST = "n8n-nodes-slack,n8n-nodes-discord,n8n-nodes-telegram,n8n-nodes-google-sheets,n8n-nodes-airtable,n8n-nodes-notion"

# ── Rate limiting for webhook endpoints ──────────────────────────────────
N8N_RATE_LIMITER_ENABLED = "true"
N8N_RATE_LIMIT_MAX = "30"
N8N_RATE_LIMIT_WINDOW_MS = "60000"

# ── Secrets (all set via wrangler secret put) ─────────────────────────────
# DB_POSTGRESDB_HOST, DB_POSTGRESDB_USER, DB_POSTGRESDB_PASSWORD
# QUEUE_BULL_REDIS_HOST, QUEUE_BULL_REDIS_PASSWORD
# N8N_ENCRYPTION_KEY
