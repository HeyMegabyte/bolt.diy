# projectsites-messenger — Listmonk "Postback" messenger bridge → SMS (Twilio) + Telegram.
#
# Listmonk only speaks email + one generic Postback HTTP messenger. This Worker IS that
# postback receiver: Listmonk POSTs a campaign message here, and the Worker fans it out to
# the right channel per the SUBSCRIBER's opted-in channels (#5). Hosted on workers.dev
# (Listmonk's container POSTs outbound to it; no zone Bot Fight Mode in the path).
#
# Secrets (wrangler secret put): TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN, TWILIO_FROM,
# TELEGRAM_BOT_TOKEN, MESSENGER_SECRET (basic-auth password Listmonk sends).
name = "projectsites-messenger"
main = "index.ts"
compatibility_date = "2026-06-01"
