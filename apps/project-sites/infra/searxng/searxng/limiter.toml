# SearXNG limiter/bot-detection — ProjectSites.dev
# Cloudflare-aware: trusts CF proxy IPs to extract real client IP from
# X-Forwarded-For / X-Real-IP / CF-Connecting-IP headers.

[botdetection]

# Full-address matching (32 bits IPv4, 48 bits IPv6).
# Behind Cloudflare, all requests appear to come from CF edge IPs.
# Trusted proxy list enables correct client IP extraction.
ipv4_prefix = 32
ipv6_prefix = 48

# Trust Cloudflare's entire edge IP ranges so SearXNG reads the real
# client IP from X-Forwarded-For / X-Real-IP headers.
# Cloudflare IP ranges source: https://www.cloudflare.com/ips-v4/ + /ips-v6/
trusted_proxies = [
  # Localhost
  '127.0.0.0/8',
  '::1',

  # Cloudflare IPv4 ranges
  '173.245.48.0/20',
  '103.21.244.0/22',
  '103.22.200.0/22',
  '103.31.4.0/22',
  '141.101.64.0/18',
  '108.162.192.0/18',
  '190.93.240.0/20',
  '188.114.96.0/20',
  '197.234.240.0/22',
  '198.41.128.0/17',
  '162.158.0.0/15',
  '104.16.0.0/13',
  '104.24.0.0/14',
  '172.64.0.0/13',
  '131.0.72.0/22',

  # Cloudflare IPv6 ranges
  '2400:cb00::/32',
  '2606:4700::/32',
  '2803:f800::/32',
  '2405:b500::/32',
  '2405:8100::/32',
  '2a06:98c0::/29',
  '2c0f:f248::/32',
]

[botdetection.ip_limit]

# Don't filter link-local (internal CF network)
filter_link_local = false

# link_token bot detection requires public_instance=true — disabled for private
link_token = false

[botdetection.ip_lists]

# Block nothing by default — CF Access gates authentication
block_ip = []

# No hardcoded passlist — CF Access is the gate
pass_ip = []

# Allow SearXNG org IPs (check.searx.space, etc.)
pass_searxng_org = true
