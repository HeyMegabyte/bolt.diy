# fly.toml — AnythingLLM on Fly.io
app = "projectsites-anythingllm"
primary_region = "ewr"

[build]
  image = "mintplexlabs/anythingllm:pg-1.15.0"

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory_mb = 4096

[[services]]
  internal_port = 3001
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]
  [[services.ports]]
    port = 80
    handlers = ["http"]

[[mounts]]
  source = "anythingllm_storage"
  destination = "/app/server/storage"

[env]
  SERVER_PORT = "3001"
  STORAGE_DIR = "/app/server/storage"
  VECTOR_DB = "pgvector"
  DISABLE_SWAGGER_DOCS = "true"
  WORKSPACE_DELETION_PROTECTION = "1"
  PASSWORDMINCHAR = "12"
  DISABLE_HTTP_LOGGER = "true"
  ANYTHINGLLM_CHROMIUM_ARGS = "--no-sandbox,--disable-setuid-sandbox"
