app = "projectsites-chatwoot"
primary_region = "ewr"

[build]
  image = "chatwoot/chatwoot:latest"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024

[env]
  RAILS_ENV = "production"
  NODE_ENV = "production"
  INSTALLATION_ENV = "docker"
  FRONTEND_URL = "https://chat.projectsites.dev"

# Required secrets (set via fly secrets):
#   SECRET_KEY_BASE    — rails secret key (openssl rand -hex 64)
#   DATABASE_URL       — Postgres (Neon)
#   REDIS_URL          — Upstash Redis (projectsites-redis)
# Set with: fly secrets set --app projectsites-chatwoot KEY=VALUE
