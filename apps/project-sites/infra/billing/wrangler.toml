name = "projectsites-lago"
main = "worker.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
account_id = "84fa0d1b16ff8086dd958c468ce7fd59"

# billing.projectsites.dev — billing service.
# zone_name route beats the main worker's *.projectsites.dev/* wildcard.
routes = [
  { pattern = "billing.projectsites.dev/*", zone_name = "projectsites.dev" },
]

workers_dev = true

[observability]
enabled = true

# ── Lago CF Container ──
[[containers]]
class_name = "Lago"
image = "./Dockerfile"
max_instances = 1
instance_type = "standard-2"
name = "projectsites-lago"

[[durable_objects.bindings]]
name = "LAGO"
class_name = "Lago"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Lago"]

# ── Secrets (set via wrangler secret put) ──
#   DATABASE_URL           — Neon Postgres (postgresql://...)
#   SECRET_KEY_BASE        — Rails secret (openssl rand -hex 64)
#   REDIS_URL              — Upstash or Fly Redis
#   LAGO_CLICKHOUSE_URL    — ch.projectsites.dev (optional analytics)
#   LAGO_CLICKHOUSE_PASSWORD — ClickHouse password
