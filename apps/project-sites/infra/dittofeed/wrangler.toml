name = "projectsites-dittofeed"
main = "worker.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
account_id = "84fa0d1b16ff8086dd958c468ce7fd59"

routes = [
  { pattern = "engage.projectsites.dev/*", zone_name = "projectsites.dev" },
]

[observability]
enabled = true

[[containers]]
class_name = "Dittofeed"
image = "./Dockerfile"
max_instances = 1
instance_type = "standard-2"
name = "projectsites-dittofeed"

[[durable_objects.bindings]]
name = "DITTOFEED"
class_name = "Dittofeed"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Dittofeed"]

# Fly ClickHouse at ch.projectsites.dev:8123 (50GB persistent, 4GB RAM)
[vars]
DATABASE_PORT = "5432"
DATABASE_NAME = "projectsites_dittofeed"
AUTH_MODE = "single-tenant"
WORKSPACE_NAME = "ProjectSites"
NODE_ENV = "production"
BOOTSTRAP = "true"
CLICKHOUSE_HOST = "http://ch.projectsites.dev:8123"
CLICKHOUSE_USER = "dittofeed"
TEMPORAL_ADDRESS = "localhost:7233"
DASHBOARD_API_BASE = "https://engage.projectsites.dev"
