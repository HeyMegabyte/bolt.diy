name = "projectsites-automation-sso"
main = "auth-bridge.ts"
compatibility_date = "2025-04-01"

routes = [
  { pattern = "automation.projectsites.dev/auth/sso/*", zone_name = "projectsites.dev" },
]

[vars]
BETTER_AUTH_URL = "https://projectsites.dev"
ACTIVE_PIECES_URL = "https://automation.projectsites.dev"

# Secrets to set before deploy:
#   BETTER_AUTH_SECRET        — get-secret BETTER_AUTH_SECRET
#   ACTIVE_PIECES_JWT_SECRET  — get-secret ACTIVE_PIECES_JWT_SECRET
#   wrangler secret put BETTER_AUTH_SECRET --name projectsites-automation-sso
#   wrangler secret put ACTIVE_PIECES_JWT_SECRET --name projectsites-automation-sso

[observability]
enabled = true
