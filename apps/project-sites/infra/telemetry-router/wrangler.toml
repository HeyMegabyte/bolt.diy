name = "projectsites-telemetry-router"
main = "worker.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
account_id = "84fa0d1b16ff8086dd958c468ce7fd59"

# Protected route — Cloudflare Access policy MUST be applied to telemetry.projectsites.dev
# before deploying to production.  Workers and internal services authenticate with CF service tokens.
routes = [
  { pattern = "telemetry.projectsites.dev", custom_domain = true },
]

[observability]
enabled = true

[[containers]]
class_name = "TelemetryRouter"
image = "./Dockerfile"
max_instances = 1
instance_type = "standard-2"
name = "projectsites-telemetry-router"

[[durable_objects.bindings]]
name = "TELEMETRY_ROUTER"
class_name = "TelemetryRouter"

# Container-backed DOs MUST use new_sqlite_classes (CF API error 10074 on new_classes).
[[migrations]]
tag = "v1"
new_sqlite_classes = ["TelemetryRouter"]

[vars]
# Non-secret config lives here. Secrets via `wrangler secret put`:
#   wrangler secret put AXIOM_API_TOKEN --env production
#   wrangler secret put AXIOM_DATASET   --env production
