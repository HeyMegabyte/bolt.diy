# Checkmate nginx config — SPA + API reverse proxy
# TLS is terminated by Fly.io / Cloudflare; we serve plain HTTP on :80
server {
    listen 80;
    listen [::]:80;
    server_name _;
    server_tokens off;

    # Gzip compression
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # Security headers (TLS-terminated upstream, so no HSTS needed here)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # React SPA — serve static files, fall back to index.html
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Cache static assets aggressively; HTML entry point is never cached
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # API proxy → Checkmate backend
    location /api/ {
        proxy_pass http://127.0.0.1:52345/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # API docs proxy
    location /api-docs/ {
        proxy_pass http://127.0.0.1:52345/api-docs/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Health check endpoint (lightweight, no DB dependency)
    location /health {
        return 200 "OK";
        add_header Content-Type text/plain;
    }
}
