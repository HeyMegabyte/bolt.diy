[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

[program:mongod]
command=mongod --dbpath /data/db --bind_ip 127.0.0.1 --quiet --logpath /var/log/mongodb/mongod.log
autostart=true
autorestart=true
startsecs=5
priority=1
stdout_logfile=/var/log/supervisor/mongod-stdout.log
stderr_logfile=/var/log/supervisor/mongod-stderr.log

[program:checkmate-server]
command=node /app/dist/index.js
directory=/app
autostart=true
autorestart=true
startsecs=10
priority=2
environment=DB_CONNECTION_STRING="mongodb://127.0.0.1:27017/uptime_db",QUEUE_MODE="primary",QUEUE_PRIMARY_PROCESSES="true"
stdout_logfile=/var/log/supervisor/checkmate-server-stdout.log
stderr_logfile=/var/log/supervisor/checkmate-server-stderr.log

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
startsecs=2
priority=3
stdout_logfile=/var/log/supervisor/nginx-stdout.log
stderr_logfile=/var/log/supervisor/nginx-stderr.log
