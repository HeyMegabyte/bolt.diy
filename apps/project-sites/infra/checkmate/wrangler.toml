name = "projectsites-checkmate"
main = "worker.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
account_id = "84fa0d1b16ff8086dd958c468ce7fd59"

routes = [
  { pattern = "monitor.projectsites.dev/*", zone_name = "projectsites.dev" },
]

[observability]
enabled = true

[[containers]]
class_name = "CheckmateContainerDO"
image = "./Dockerfile.frontend"
max_instances = 1
instance_type = "basic"

[[durable_objects.bindings]]
name = "CHECKMATE"
class_name = "CheckmateContainerDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CheckmateContainerDO"]
