# Fly.io app: projectsites-checkmate
# Combined: MongoDB + Node.js backend + nginx frontend (all in one container)
# Frontend also served via CF Container at monitor.projectsites.dev if that route works.
#
# MongoDB Atlas is the TARGET but currently blocked by IP whitelist.
# Fallback: local MongoDB with persistent volume.
# When Atlas whitelist is updated, set DB_CONNECTION_STRING to the Atlas URI.

app            = "projectsites-checkmate"
primary_region = "iad"
kill_signal    = "SIGTERM"
kill_timeout   = 30

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV                = "production"
  LOG_LEVEL               = "info"
  CLIENT_HOST             = "https://monitor.projectsites.dev"
  QUEUE_MODE              = "primary"
  QUEUE_PRIMARY_PROCESSES = "true"
  TOKEN_TTL               = "30d"
  STATUS_PAGE_THEMES_ENABLED = "true"
  DB_CONNECTION_STRING    = "mongodb://127.0.0.1:27017/uptime_db"

[mounts]
  source      = "checkmate_mongo_data"
  destination = "/data/db"

[http_service]
  internal_port        = 80
  force_https          = true
  auto_stop_machines   = false
  auto_start_machines  = true
  min_machines_running = 1

  [http_service.concurrency]
    type       = "connections"
    hard_limit = 100
    soft_limit = 80

  [[http_service.checks]]
    grace_period = "90s"
    interval     = "15s"
    timeout      = "5s"
    method       = "get"
    path         = "/health"

[[vm]]
  size = "shared-cpu-2x"
