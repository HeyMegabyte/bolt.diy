# Nginx origin gateway — rejects requests without X-ProjectSites-Origin-Secret
# Proxies validated requests to OpenHands Agent Canvas on :8000
# Supports WebSocket upgrade for agent event streams

upstream openhands_backend {
    server 127.0.0.1:8000;
}

# Map WebSocket upgrade
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;

    # Max body size for file uploads
    client_max_body_size 100m;

    # Long timeouts for agent sessions
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_connect_timeout 60s;

    # Origin secret validation — reject if missing or wrong
    set $origin_secret "";
    if ($http_x_projectsites_origin_secret = "") {
        return 403 '{"error":"Direct origin access forbidden"}';
    }

    location / {
        proxy_pass http://openhands_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Don't buffer SSE/streaming responses
        proxy_buffering off;
        proxy_cache off;

        # Pass origin secret downstream if OpenHands needs it
        proxy_set_header X-ProjectSites-Origin-Secret $http_x_projectsites_origin_secret;
    }

    location /health {
        proxy_pass http://openhands_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }
}
