# Fly.io app: projectsites-openhands — OpenHands Agent Canvas
# Public front door: Cloudflare Worker at openhands.projectsites.dev
# Origin protection: Worker auth + secret header

app            = "projectsites-openhands"
primary_region = "iad"
kill_signal    = "SIGTERM"
kill_timeout   = 30

[build]
  image = "ghcr.io/openhands/agent-canvas:1.1.0"

[env]
  PORT                              = "8000"

[http_service]
  internal_port        = 8000
  force_https          = true
  auto_stop_machines   = false
  auto_start_machines  = true
  min_machines_running = 1

  [http_service.concurrency]
    type       = "connections"
    hard_limit = 50
    soft_limit = 35

  [[http_service.checks]]
    grace_period = "45s"
    interval     = "15s"
    timeout      = "10s"
    method       = "get"
    path         = "/"

[[vm]]
  size   = "shared-cpu-4x"
  memory = "8GB"

[mounts]
  source      = "openhands_data"
  destination = "/home/openhands/.openhands"
