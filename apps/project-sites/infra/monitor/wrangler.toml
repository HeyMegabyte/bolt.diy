name = "projectsites-site-health"
main = "worker.ts"
compatibility_date = "2025-04-01"
account_id = "84fa0d1b16ff8086dd958c468ce7fd59"

[triggers]
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "project-sites-db-production"
database_id = "ea3e839a-c641-4861-ae30-dfc63bff8032"

# Workflow binding requires class_name in prod wrangler.toml.
# For this Worker, rebuilds are enqueued via direct Workflow API call.
# Set up after Workflow binding is provisioned:
# [[workflows]]
# binding = "SITE_WORKFLOW"
# name = "site-generation"
# class_name = "SiteGenerationWorkflow"

[vars]
ADMIN_EMAIL = "brian@megabyte.space"
HEALTH_CHECK_USER_AGENT = "ProjectSites-HealthCheck/1.0"

[observability]
enabled = true
