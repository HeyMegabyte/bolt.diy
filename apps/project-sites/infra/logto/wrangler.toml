name = "projectsites-logto"
main = "worker.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
account_id = "84fa0d1b16ff8086dd958c468ce7fd59"

# auth.projectsites.dev → this container worker. Zone already on Cloudflare, so
# custom_domain creates the proxied DNS record + cert on deploy. (Explicit host
# route beats the *.projectsites.dev wildcard that otherwise 404s.)
routes = [
  { pattern = "auth.projectsites.dev", custom_domain = true },
  { pattern = "auth.projectsites.dev/*", zone_name = "projectsites.dev" },
]

[observability]
enabled = true

[[containers]]
class_name = "Logto"
image = "./Dockerfile"
max_instances = 1
instance_type = "standard-1"   # Logto core+admin need more RAM than basic
name = "projectsites-logto"

[[durable_objects.bindings]]
name = "LOGTO"
class_name = "Logto"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Logto"]

# Secrets (set via `wrangler secret put` against this project, or in CI):
#   DB_URL  — postgres://projectsites_logto:<pw>@<neon-pooler-host>/projectsites_logto?sslmode=require
# Non-secret origins live in worker.ts envVars (ENDPOINT/ADMIN_ENDPOINT).
[vars]
TRUST_PROXY_HEADER = "1"
