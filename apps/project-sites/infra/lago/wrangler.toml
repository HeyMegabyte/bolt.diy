name = "projectsites-lago"
main = "worker.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
account_id = "84fa0d1b16ff8086dd958c468ce7fd59"

# billing.projectsites.dev → this container worker
routes = [
  { pattern = "billing.projectsites.dev", custom_domain = true },
]

[observability]
enabled = true

[[containers]]
class_name = "LagoContainerDO"
image = "./Dockerfile"
max_instances = 1
instance_type = "basic"
name = "projectsites-lago"

[[durable_objects.bindings]]
name = "LAGO"
class_name = "LagoContainerDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LagoContainerDO"]

# ── Vars forwarded into the container ────────────────────────────────────
[vars]
RACK_ENV = "production"
RAILS_ENV = "production"
PORT = "3000"
LAGO_FRONT_URL = "https://billing.projectsites.dev"
LAGO_API_URL = "https://billing.projectsites.dev/api"

# ── Secrets (all set via wrangler secret put) ────────────────────────────
# DATABASE_URL, REDIS_URL, REDIS_CACHE_URL
# SECRET_KEY_BASE, LAGO_RSA_PRIVATE_KEY
# LAGO_ENCRYPTION_PRIMARY_KEY, LAGO_ENCRYPTION_DETERMINISTIC_KEY
# LAGO_ENCRYPTION_KEY_DERIVATION_SALT, LAGO_DISABLE_SIGNUP
