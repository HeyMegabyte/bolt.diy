# Lago API proxy — allows all HTTP methods to /api/* → Rails :3000
# Loaded before the entrypoint-generated config (00- prefix sorts first).
# Without this, the stock Lago entrypoint generates a config that blocks POST to /api/graphql.
location /api/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}

location /health {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
}
