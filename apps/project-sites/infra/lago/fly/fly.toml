# Lago full stack on Fly.io — nginx :80 + Rails :3000 + Sidekiq
app = "lago-worker-ps"

[build]
dockerfile = "Dockerfile"

[env]
RAILS_ENV = "production"
RACK_ENV = "production"
PORT = "3000"
LAGO_FRONT_URL = "https://billing.projectsites.dev"
LAGO_API_URL = "https://billing.projectsites.dev"
API_URL = ""

[[vm]]
cpu_kind = "shared"
cpus = 1
memory_mb = 1024

[[services]]
protocol = "tcp"
internal_port = 80
processes = ["app"]

[[services.tcp_checks]]
interval = "10s"
timeout = "3s"

[processes]
app = "bundle exec sidekiq -C config/sidekiq.yml"
