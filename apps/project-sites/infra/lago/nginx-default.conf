# Lago nginx config — allows all HTTP methods through to Rails on :3000.
# The stock Lago image restricts POST to /api/graphql, breaking signup/login.
server {
    listen 80 default_server;
    server_name _;

    # Front-end SPA
    root /app/public;
    index index.html;

    # Let Rails handle all API calls — no method restriction
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Health check
    location /health {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }

    # SPA fallback — everything else serves index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
