app = "projectsites-lago"
primary_region = "iad"

[build]
  image = "ghcr.io/getlago/api:latest"

[env]
  RAILS_ENV = "production"
  LAGO_FRONT_URL = "https://billing.projectsites.dev"
  LAGO_API_URL = "https://billing.projectsites.dev"
  LAGO_CLICKHOUSE_URL = "http://ch.projectsites.dev:8123"
  LAGO_CLICKHOUSE_DATABASE = "lago"
  LAGO_CLICKHOUSE_USERNAME = "dittofeed"
  # GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET come from get-secret
  # GOOGLE_CLIENT_ID = ""   # set via: fly secrets set GOOGLE_CLIENT_ID=...
  # GOOGLE_CLIENT_SECRET = "" # set via: fly secrets set GOOGLE_CLIENT_SECRET=...

[experimental]
  auto_rollback = false

[[vm]]
  size = "shared-cpu-2x"
  memory = "4096mb"

[[services]]
  internal_port = 3000
  protocol = "tcp"

  [[services.ports]]
    port = 3000
    handlers = ["http"]

  [[services.http_checks]]
    interval = "30s"
    timeout = "15s"
    method = "GET"
    path = "/health"
