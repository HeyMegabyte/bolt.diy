app = "projectsites-maxun"
primary_region = "ewr"

[build]
  dockerfile = "Dockerfile"

[env]
  BACKEND_PORT = "8080"
  NODE_ENV = "production"
  MAXUN_TELEMETRY = "false"

  # R2 storage (replaces MinIO)
  MINIO_ENDPOINT = "84fa0d1b16ff8086dd958c468ce7fd59.r2.cloudflarestorage.com"
  MINIO_PORT = "443"
  MINIO_USE_SSL = "true"
  MINIO_REGION = "auto"
  MINIO_PUBLIC_URL = "https://maxun.projectsites.dev/storage"

[[services]]
  protocol = "tcp"
  internal_port = 80

  [[services.ports]]
    port = 80
    handlers = ["http"]
  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"

[[vm]]
  memory = "4gb"
  cpu_kind = "shared"
  cpus = 2
