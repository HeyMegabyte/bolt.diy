app = "projectsites-maxun-browser"
primary_region = "ewr"

[build]
  image = "getmaxun/maxun-browser:latest"

[env]
  BROWSER_WS_PORT = "3001"
  BROWSER_HEALTH_PORT = "3002"
  NODE_ENV = "production"
  BROWSER_WS_HOST = "projectsites-maxun-browser.internal"

[[services]]
  protocol = "tcp"
  internal_port = 3002

  [[services.ports]]
    port = 3002

  [[services.tcp_checks]]
    interval = "30s"
    timeout = "10s"
    grace_period = "120s"
    restart_limit = 3

[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 2
