app = "projectsites-teable"
primary_region = "ewr"

[build]
  image = "ghcr.io/teableio/teable:latest"

[[vm]]
  memory = "4gb"
  cpu_kind = "shared"
  cpus = 4

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 50

[env]
  PORT = "3000"
  SOCKET_PORT = "3000"
  PUBLIC_ORIGIN = "https://teable.projectsites.dev"
  NEXT_ENV_IMAGES_ALL_REMOTE = "true"
  LOG_LEVEL = "info"
  BACKEND_CACHE_PROVIDER = "redis"
  # Storage: local for initial deployment (S3/R2 requires access keys)
  # Switch to BACKEND_STORAGE_PROVIDER=s3 once R2 API tokens are provisioned
  BACKEND_STORAGE_PROVIDER = "local"
  STORAGE_PREFIX = "https://teable-assets.projectsites.dev"

# Secrets set via `flyctl secrets set`:
#   DATABASE_URL           Neon Postgres pooled URL (DB `projectsites_teable`)
#   PRISMA_DATABASE_URL    Same as DATABASE_URL (Prisma)
#   SECRET_KEY             App encryption key
#   BACKEND_CACHE_REDIS_URI       Upstash Redis (cache)
#   BACKEND_PERFORMANCE_CACHE     Upstash Redis (perf)
