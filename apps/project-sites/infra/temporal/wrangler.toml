name = "projectsites-temporal"
main = "worker.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
account_id = "84fa0d1b16ff8086dd958c468ce7fd59"

routes = [
  { pattern = "temporal.projectsites.dev", custom_domain = true },
]

[observability]
enabled = true

[[containers]]
class_name = "Temporal"
image = "./Dockerfile"
max_instances = 1
instance_type = "standard-2"
name = "projectsites-temporal"

[[durable_objects.bindings]]
name = "TEMPORAL"
class_name = "Temporal"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Temporal"]
