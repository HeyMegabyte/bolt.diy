  <rect x="1120" y="120" width="380" height="270" rx="6" fill="url(#generic-card)"/>
  <circle cx="1190" cy="200" r="32" fill="#ced4da"/>
  <rect x="1240" y="180" width="180" height="14" rx="2" fill="#adb5bd"/>
  <rect x="1240" y="206" width="140" height="14" rx="2" fill="#ced4da"/>
  <rect x="1150" y="270" width="320" height="100" rx="4" fill="#dee2e6"/>
