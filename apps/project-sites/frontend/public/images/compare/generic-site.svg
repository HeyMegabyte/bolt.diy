  <g>
    <rect x="570" y="430" width="460" height="220" rx="6" fill="url(#generic-card)"/>
    <rect x="590" y="450" width="60" height="60" rx="4" fill="#adb5bd"/>
    <rect x="670" y="460" width="240" height="18" rx="2" fill="#495057"/>
    <rect x="670" y="490" width="180" height="14" rx="2" fill="#868e96"/>
    <rect x="590" y="540" width="380" height="12" rx="2" fill="#ced4da"/>
    <rect x="590" y="560" width="320" height="12" rx="2" fill="#ced4da"/>
    <rect x="590" y="580" width="360" height="12" rx="2" fill="#ced4da"/>
