    <rect x="100" y="450" width="60" height="60" rx="4" fill="#adb5bd"/>
    <rect x="180" y="460" width="240" height="18" rx="2" fill="#495057"/>
    <rect x="180" y="490" width="180" height="14" rx="2" fill="#868e96"/>
    <rect x="100" y="540" width="380" height="12" rx="2" fill="#ced4da"/>
    <rect x="100" y="560" width="320" height="12" rx="2" fill="#ced4da"/>
    <rect x="100" y="580" width="360" height="12" rx="2" fill="#ced4da"/>
