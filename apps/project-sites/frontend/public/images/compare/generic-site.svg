  <!-- footer band -->
  <rect x="0" y="900" width="1600" height="100" fill="#343a40"/>
  <rect x="80" y="930" width="160" height="14" rx="2" fill="#868e96"/>
  <rect x="80" y="955" width="220" height="12" rx="2" fill="#495057"/>
  <rect x="1300" y="930" width="220" height="40" rx="3" fill="#212529"/>
