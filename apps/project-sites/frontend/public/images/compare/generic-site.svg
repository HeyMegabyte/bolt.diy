      <stop offset="0" stop-color="#e9ecef"/>
      <stop offset="1" stop-color="#cdd3da"/>
    </linearGradient>
    <linearGradient id="generic-card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f3f5"/>
      <stop offset="1" stop-color="#dee2e6"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#generic-bg)"/>
  <!-- nav -->
  <rect x="0" y="0" width="1600" height="64" fill="#ffffff" opacity="0.92"/>
  <circle cx="48" cy="32" r="14" fill="#adb5bd"/>
  <rect x="76" y="24" width="120" height="16" rx="3" fill="#868e96"/>
  <rect x="1180" y="22" width="60" height="20" rx="3" fill="#adb5bd"/>
  <rect x="1260" y="22" width="60" height="20" rx="3" fill="#adb5bd"/>
  <rect x="1340" y="22" width="60" height="20" rx="3" fill="#adb5bd"/>
  <rect x="1430" y="20" width="140" height="24" rx="4" fill="#6c757d"/>
  <!-- hero band -->
  <rect x="80" y="120" width="980" height="36" rx="3" fill="#495057"/>
  <rect x="80" y="174" width="780" height="36" rx="3" fill="#6c757d"/>
  <rect x="80" y="240" width="620" height="20" rx="3" fill="#868e96"/>
  <rect x="80" y="270" width="540" height="20" rx="3" fill="#868e96"/>
  <rect x="80" y="320" width="200" height="48" rx="4" fill="#fa5252"/>
