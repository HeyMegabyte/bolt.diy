<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <title>Offline — ProjectSites</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#060610" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <style>
      :root {
        color-scheme: dark light;
        --bg: #060610;
        --ink: #f4f4ff;
        --accent: #00e5ff;
        --muted: rgba(244, 244, 255, 0.62);
        --rule: rgba(244, 244, 255, 0.08);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--ink);
        font-family:
          'Sora',
          'Inter',
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
      }
      main {
        max-width: 38rem;
        margin: 0 auto;
        padding: clamp(2rem, 8vw, 6rem) 1.5rem;
        display: grid;
        gap: 1.25rem;
      }
      .eyebrow {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        font-size: 0.75rem;
        color: var(--accent);
      }
      h1 {
        font-family: 'Space Grotesk', 'Sora', sans-serif;
        font-size: clamp(2rem, 6vw, 3.25rem);
        line-height: 1.05;
        letter-spacing: -0.02em;
        margin: 0;
        text-wrap: balance;
      }
      p {
        font-size: 1.05rem;
        line-height: 1.55;
        color: var(--muted);
        text-wrap: pretty;
        margin: 0;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin-top: 0.75rem;
      }
      button,
      a.button {
        appearance: none;
        background: var(--accent);
        color: #001619;
        border: 0;
        border-radius: 0.75rem;
        padding: 0.85rem 1.4rem;
        font-weight: 600;
        font-family: inherit;
        font-size: 0.95rem;
        cursor: pointer;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        transition: transform 120ms ease-out;
      }
      button:hover,
      a.button:hover {
        transform: translateY(-1px);
      }
      a.button.ghost {
        background: transparent;
        color: var(--ink);
        border: 1px solid var(--rule);
      }
      .meta {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 0.78rem;
        color: var(--muted);
        margin-top: 2rem;
        padding-top: 1.25rem;
        border-top: 1px solid var(--rule);
      }
      @media (prefers-reduced-motion: reduce) {
        button,
        a.button {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <span class="eyebrow">Offline</span>
      <h1>You&rsquo;re off the grid.</h1>
      <p>
        ProjectSites can&rsquo;t reach the edge right now. Cached pages still work — every action you
        take queues for sync the moment you&rsquo;re back.
      </p>
      <div class="actions">
        <button type="button" onclick="window.location.reload()">Retry connection</button>
        <a class="button ghost" href="/dashboard">Go to cached dashboard</a>
      </div>
      <div class="meta">Kill-switch ready · Workbox SW · last-known-good shell.</div>
    </main>
    <script>
      // Listen for `online` events and auto-reload so the user never has to.
      window.addEventListener('online', () => window.location.reload());
    </script>
  </body>
</html>
