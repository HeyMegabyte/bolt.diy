<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <title>ProjectSites — AI-native SaaS site builder</title>
    <base href="/" />
    <meta
      name="description"
      content="ProjectSites builds, hosts, and runs your business website on Cloudflare's edge — generated by AI, branded for you, and live in minutes."
    />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#060610" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f7f7fc" media="(prefers-color-scheme: light)" />

    <!-- Manifest + favicons -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="mask-icon" href="safari-pinned-tab.svg" color="#00e5ff" />

    <!-- Brand canonical (override per-route via app head) -->
    <link rel="canonical" href="https://projectsites.dev/" />

    <!-- Open Graph / Twitter -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ProjectSites" />
    <meta property="og:title" content="ProjectSites — AI-native SaaS site builder" />
    <meta
      property="og:description"
      content="Generated, branded, and live in minutes. AI builds and runs your site on Cloudflare's edge."
    />
    <meta property="og:image" content="https://projectsites.dev/og/default.png" />
    <meta property="og:url" content="https://projectsites.dev/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://projectsites.dev/og/default.png" />

    <!-- Resource hints — DNS-prefetch + preconnect for the surfaces every
         page will touch. `crossorigin` on preconnect is mandatory for
         CORS-enabled origins (fonts, Stripe). -->
    <link rel="dns-prefetch" href="https://api.projectsites.dev" />
    <link rel="preconnect" href="https://api.projectsites.dev" crossorigin />
    <link rel="dns-prefetch" href="https://js.stripe.com" />
    <link rel="preconnect" href="https://js.stripe.com" crossorigin />
    <link rel="dns-prefetch" href="https://static.cloudflareinsights.com" />
    <link rel="preconnect" href="https://static.cloudflareinsights.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Brand font preloads — Sora display + Space Grotesk heading + JetBrains
         Mono. woff2 only; the @font-face decls live in `styles.scss`. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
      href="fonts/sora-variable.woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
      href="fonts/space-grotesk-variable.woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
      href="fonts/jetbrains-mono-variable.woff2"
    />

    <!-- Speculation Rules: prerender the dashboard shell on viewport-edge
         hover. Marketing routes are excluded so GA4 page-views stay
         conversion-accurate per `[[always]]` § resource hints. -->
    <script type="speculationrules">
      {
        "prerender": [
          {
            "where": { "href_matches": "/dashboard" },
            "eagerness": "moderate"
          }
        ]
      }
    </script>
  </head>
  <body data-density="comfortable">
    <app-root></app-root>
  </body>
</html>
