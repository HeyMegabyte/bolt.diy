<section class="ps-passkey-list" data-testid="passkey-list">
  <header class="ps-passkey-list__header">
    <h3>Your passkeys</h3>
  </header>

  @if (error()) {
    <p-message severity="error" [text]="error()!" data-testid="passkey-list-error"></p-message>
  }

  @if (passkeys().length === 0) {
    <p class="ps-passkey-list__empty">No passkeys on this account yet.</p>
  } @else {
    <p-table [value]="[...passkeys()]" data-testid="passkey-table" responsiveLayout="stack">
      <ng-template pTemplate="header">
        <tr>
          <th>Label</th>
          <th>Added</th>
          <th>Last used</th>
          <th class="ps-passkey-list__actions-col"></th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-row>
        <tr [attr.data-testid]="'passkey-row-' + row.id">
          <td>{{ row.label }}</td>
          <td>{{ row.created_at | date: 'medium' }}</td>
          <td>{{ row.last_used_at ? (row.last_used_at | date: 'medium') : 'Never' }}</td>
          <td class="ps-passkey-list__actions-col">
            <button
              pButton
              type="button"
              severity="danger"
              size="small"
              icon="pi pi-trash"
              label="Remove"
              [disabled]="row.is_last"
              [attr.data-testid]="'passkey-remove-' + row.id"
              (click)="remove(row)"
            ></button>
          </td>
        </tr>
      </ng-template>
    </p-table>
  }
</section>
