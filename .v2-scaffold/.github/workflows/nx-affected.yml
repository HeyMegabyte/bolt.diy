name: Nx Affected CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_VERSION: '22'
  NX_CLOUD_DISTRIBUTED_EXECUTION: 'false'
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

jobs:
  affected:
    name: nx affected (lint / test / build / e2e / typedoc / lighthouse)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (full history for nx affected base diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Derive Nx affected base/head SHAs
        uses: nrwl/nx-set-shas@v4

      - name: nx affected -t lint
        run: npx nx affected -t lint --parallel=3

      - name: nx affected -t test
        run: npx nx affected -t test --parallel=3 --configuration=ci

      - name: nx affected -t build
        run: npx nx affected -t build --parallel=3

      - name: Install Playwright browsers (only if e2e affected)
        run: |
          if npx nx show projects --affected --with-target=e2e | grep -q .; then
            npx playwright install --with-deps chromium
          else
            echo "No e2e-affected projects; skipping browser install"
          fi

      - name: nx affected -t e2e
        run: npx nx affected -t e2e --parallel=1

      - name: Generate TypeDoc (full repo, not affected — docs are global)
        if: github.ref == 'refs/heads/main'
        run: npx typedoc

      - name: Upload TypeDoc artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: typedoc-html
          path: docs/api
          retention-days: 30

      - name: Lighthouse CI on web app (smoke perf gate)
        if: github.ref == 'refs/heads/main'
        run: |
          npm install -g @lhci/cli@latest
          npx nx build web --configuration=production
          lhci autorun --collect.staticDistDir=dist/apps/web/browser --upload.target=temporary-public-storage --assert.preset=lighthouse:recommended || true

      - name: Surface affected graph (artifact)
        run: |
          mkdir -p docs
          npx nx graph --file=docs/nx-graph.json --affected

      - name: Upload affected graph
        uses: actions/upload-artifact@v4
        with:
          name: nx-affected-graph
          path: docs/nx-graph.json
          retention-days: 14
