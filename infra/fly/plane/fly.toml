# Fly.io app: plane — Plane project management at projects.projectsites.dev
#
# ARCHITECTURE NOTE (mirrors support-chatwoot — Fly is the stateful-heavy escape
# hatch per cloudflare-first.md; Plane is a multi-service Django+Next app that does
# NOT fit a single CF Container):
#   projects.projectsites.dev → this Fly app (Plane proxy → api/web/space/admin).
#   Postgres → DATABASE `projectsites_plane` in the SHARED Neon project
#              (neon-database-conservation.md: a database, never a new project).
#   Redis    → Upstash Redis (rediss://…).
#   Storage  → R2 bucket (S3-compatible) for uploads/attachments (MinIO replacement).
#
# CF ROUTING (critical — learned from cms/crm/mail): a `*.projectsites.dev/*`
# wildcard Worker route SHADOWS a custom hostname. After deploy, add an EXPLICIT
# `projects.projectsites.dev/*` route (higher precedence) + a CNAME → this Fly app,
# else it 404s through the main Worker (current state).
#
# SECRETS (flyctl secrets set --app plane):
#   SECRET_KEY             — Django secret (openssl rand -hex 50)
#   DATABASE_URL           — postgres://projectsites_plane:<pw>@<neon-host>/projectsites_plane?sslmode=require
#   REDIS_URL              — Upstash rediss://…
#   AWS_S3_ENDPOINT_URL    — https://<account>.r2.cloudflarestorage.com
#   AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY — R2 token
#   AWS_S3_BUCKET_NAME     — projectsites-plane
#
# FIRST-BOOT: run migrations once —
#   flyctl ssh console --app plane -C "python manage.py migrate"

app            = "plane"
primary_region = "iad"
kill_signal    = "SIGTERM"
kill_timeout   = 30

# Plane's web-facing proxy (Caddy) routes / → web, /api → api, /spaces → space,
# /god-mode → admin. We run the proxy as the http entrypoint; companion services
# run as Fly processes sharing the private network.
[build]
  image = "makeplane/plane-proxy:stable"

[env]
  # Public origin — Plane builds absolute URLs from these.
  WEB_URL              = "https://projects.projectsites.dev"
  CORS_ALLOWED_ORIGINS = "https://projects.projectsites.dev"
  GUNICORN_WORKERS     = "2"
  # Internal upstream targets the proxy fans out to (Fly private DNS).
  FILE_SIZE_LIMIT      = "5242880"
  BUCKET_NAME          = "projectsites-plane"
  # DATABASE_URL / REDIS_URL / SECRET_KEY / AWS_* come from Fly secrets.

[http_service]
  internal_port        = 80
  force_https          = true
  auto_stop_machines   = false
  auto_start_machines  = true
  min_machines_running = 1

[[vm]]
  cpu_kind = "shared"
  cpus     = 2
  memory   = "2gb"

# NOTE: Plane's api / worker / beat / web / space / admin services are declared
# as additional [[processes]] (or sibling Fly apps) in the full deploy — see
# infra/fly/plane/README.md for the complete process list + the docker-compose →
# Fly mapping. This file is the proxy entrypoint scaffold; companion processes
# are added in the build-out fire.
