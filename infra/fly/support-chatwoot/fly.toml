# Fly.io app: support-chatwoot
#
# ARCHITECTURE NOTE:
#   support.projectsites.dev → this Fly app (Chatwoot).
#   Postgres  → a DATABASE named "projectsites_chatwoot" in the SHARED Neon project
#               (jolly-pine-24431114). Per neon-database-conservation.md: never create
#               a new Neon project for a single app; allocate a database instead.
#   Redis     → Upstash Redis (CF-only alt: Upstash is the sanctioned fallback for
#               Redis primitives such as Sidekiq queues / Action Cable pub-sub).
#
# SECRETS (set via `flyctl secrets set KEY=value --app support-chatwoot`):
#   SECRET_KEY_BASE          — Rails secret key (generate: openssl rand -hex 64)
#   POSTGRES_PASSWORD        — Neon database password
#   REDIS_URL                — Upstash Redis URL (rediss://...)
#   SMTP_ADDRESS             — SMTP host for outbound email
#   SMTP_USERNAME            — SMTP username / API key
#   SMTP_PASSWORD            — SMTP password / API key secret
#   MAILER_SENDER_EMAIL      — From address (e.g. support@projectsites.dev)
#
# FIRST-BOOT SETUP:
#   After deploying for the first time, run the Chatwoot DB prepare task:
#     flyctl ssh console --app support-chatwoot -C "bundle exec rails db:chatwoot_prepare"
#   This creates schema + seeds default data. Only needed once.

app            = "support-chatwoot"
primary_region = "iad"
kill_signal    = "SIGTERM"
kill_timeout   = 30

[build]
  image = "chatwoot/chatwoot:latest"

[env]
  RAILS_ENV              = "production"
  NODE_ENV               = "production"
  INSTALLATION_ENV       = "docker"
  FRONTEND_URL           = "https://support.projectsites.dev"
  FORCE_SSL              = "true"
  ENABLE_ACCOUNT_SIGNUP  = "false"   # operator-only signups; invite users from admin
  LOG_LEVEL              = "warn"
  LOG_SIZE               = "500"
  POSTGRES_HOST          = "ep-REPLACE-neon-hostname.us-east-2.aws.neon.tech"  # PLACEHOLDER
  POSTGRES_PORT          = "5432"
  POSTGRES_DB            = "projectsites_chatwoot"
  POSTGRES_USERNAME      = "projectsites_chatwoot"
  # POSTGRES_PASSWORD, SECRET_KEY_BASE, REDIS_URL, SMTP_* come from Fly secrets

# ------------------------------------------------------------------
# Web process — serves the Rails app + ActionCable
# ------------------------------------------------------------------
[[processes]]
  name    = "web"
  command = "bundle exec rails server -p 3000 -b 0.0.0.0"

[http_service]
  internal_port       = 3000
  force_https         = true
  auto_stop_machines  = false   # support desk must be always-on
  auto_start_machines = true
  min_machines_running = 1
  processes           = ["web"]

  [http_service.concurrency]
    type       = "connections"
    hard_limit = 100
    soft_limit = 80

[checks]
  [checks.health]
    grace_period = "30s"   # Rails boot takes time
    interval     = "30s"
    method       = "get"
    path         = "/auth/sign_in"
    port         = 3000
    timeout      = "10s"
    type         = "http"

# ------------------------------------------------------------------
# Worker process — Sidekiq background jobs
# ------------------------------------------------------------------
[[processes]]
  name    = "worker"
  command = "bundle exec sidekiq -C config/sidekiq.yml"

# ------------------------------------------------------------------
# Shared VM config (applies to all process groups unless overridden)
# ------------------------------------------------------------------
[[vm]]
  size   = "shared-cpu-1x"
  memory = "512mb"

# Override worker: Sidekiq needs more memory for AI/email jobs
[[vm]]
  processes = ["worker"]
  size      = "shared-cpu-1x"
  memory    = "1gb"
