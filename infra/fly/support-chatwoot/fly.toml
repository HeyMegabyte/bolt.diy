# Fly.io app: support-chatwoot
#
# ARCHITECTURE NOTE:
#   support.projectsites.dev → this Fly app (Chatwoot).
#   Postgres  → DATABASE "projectsites_chatwoot" in shared Neon project
#               (jolly-pine-24431114). Per neon-database-conservation.md.
#   Redis     → Upstash Redis (elegant-ringtail-155630.upstash.io:6379)
#
# SECRETS (set via `flyctl secrets set KEY=value --app support-chatwoot`):
#   SECRET_KEY_BASE          — Rails secret key (openssl rand -hex 64)
#   POSTGRES_PASSWORD        — Neon database password
#   REDIS_URL                — Upstash Redis URL (rediss://...)
#   SMTP_ADDRESS             — SMTP host
#   SMTP_USERNAME            — SMTP username
#   SMTP_PASSWORD            — SMTP password
#   MAILER_SENDER_EMAIL      — From address (e.g. support@projectsites.dev)
#
# FIRST-BOOT SETUP:
#   flyctl ssh console --app support-chatwoot -C "bundle exec rails db:chatwoot_prepare"

app            = "support-chatwoot"
primary_region = "iad"
kill_signal    = "SIGTERM"
kill_timeout   = 30

[build]
  image = "chatwoot/chatwoot:latest"

# Run DB prepare before the first deploy — Chatwoot schema must exist
# before the web process boots
[deploy]
  release_command = "bundle exec rails db:chatwoot_prepare"

[env]
  RAILS_ENV              = "production"
  NODE_ENV               = "production"
  INSTALLATION_ENV       = "docker"
  FRONTEND_URL           = "https://support.projectsites.dev"
  FORCE_SSL              = "true"
  ENABLE_ACCOUNT_SIGNUP  = "false"   # operator-only signups; invite users from admin
  LOG_LEVEL              = "info"
  LOG_SIZE               = "500"
  POSTGRES_HOST          = "ep-round-wildflower-aigybxdk-pooler.c-4.us-east-1.aws.neon.tech"
  POSTGRES_PORT          = "5432"
  POSTGRES_DB            = "projectsites_chatwoot"
  POSTGRES_USERNAME      = "neondb_owner"
  # POSTGRES_PASSWORD, SECRET_KEY_BASE, REDIS_URL, SMTP_* come from Fly secrets
  # R2 / Active Storage (S3-compatible) — storage keys in Fly secrets
  ACTIVE_STORAGE_SERVICE          = "s3_compatible"
  STORAGE_BUCKET_NAME             = "projectsites-chatwoot"
  STORAGE_REGION                  = "auto"
  STORAGE_ENDPOINT                = "https://84fa0d1b16ff8086dd958c468ce7fd59.r2.cloudflarestorage.com"
  STORAGE_FORCE_PATH_STYLE        = "true"

# ------------------------------------------------------------------
# Web process — serves the Rails app + ActionCable
# ------------------------------------------------------------------
[[processes]]
  name    = "web"
  command = "bundle exec rails server -p 3000 -b 0.0.0.0"

[http_service]
  internal_port       = 3000
  force_https         = true
  auto_stop_machines  = false   # support desk must be always-on
  auto_start_machines = true
  min_machines_running = 1
  processes           = ["web"]

  [http_service.concurrency]
    type       = "connections"
    hard_limit = 100
    soft_limit = 80

[checks]
  [checks.health]
    grace_period = "60s"   # Rails boot + DB migration takes time
    interval     = "30s"
    method       = "get"
    path         = "/auth/sign_in"
    port         = 3000
    timeout      = "15s"
    type         = "http"

# ------------------------------------------------------------------
# Worker process — Sidekiq background jobs
# ------------------------------------------------------------------
[[processes]]
  name    = "worker"
  command = "bundle exec sidekiq -C config/sidekiq.yml"

# ------------------------------------------------------------------
# Shared VM config (applies to all process groups unless overridden)
# ------------------------------------------------------------------
[[vm]]
  size   = "shared-cpu-1x"
  memory = "512mb"

# Override worker: Sidekiq needs more memory for AI/email jobs
[[vm]]
  processes = ["worker"]
  size      = "shared-cpu-1x"
  memory    = "1gb"
