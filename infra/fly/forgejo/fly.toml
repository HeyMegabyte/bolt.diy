# Fly.io app: projectsites-forgejo — Git forge at git.projectsites.dev
#
# Minimal config — Forgejo will use SQLite defaults and show install page.
# Add Postgres/R2/Redis configs after initial install is verified.

app            = "projectsites-forgejo"
primary_region = "iad"
kill_signal    = "SIGTERM"
kill_timeout   = 30

[build]
  image = "codeberg.org/forgejo/forgejo:10"

[env]
  FORGEJO__server__DOMAIN                = "git.projectsites.dev"
  FORGEJO__server__ROOT_URL              = "https://git.projectsites.dev/"
  FORGEJO__server__HTTP_PORT             = "3000"
  FORGEJO__server__LANDING_PAGE          = "login"
  FORGEJO__server__DISABLE_SSH           = "true"
  FORGEJO__log__LEVEL                    = "info"
  FORGEJO__service__DISABLE_REGISTRATION = "true"
  FORGEJO__service__REQUIRE_SIGNIN_VIEW  = "false"
  FORGEJO__service__DEFAULT_KEEP_EMAIL_PRIVATE = "true"
  FORGEJO__repository__DEFAULT_PRIVATE   = "true"

[mounts]
  source      = "forgejo_data"
  destination = "/data"

[http_service]
  internal_port        = 3000
  force_https          = true
  auto_stop_machines   = false
  auto_start_machines  = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "1m"
    interval     = "15s"
    timeout      = "10s"
    method       = "get"
    path         = "/"

[[vm]]
  cpu_kind = "shared"
  cpus     = 1
  memory   = "2gb"
