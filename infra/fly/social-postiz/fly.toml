# Fly.io app: social-postiz
#
# ARCHITECTURE NOTE:
#   Postiz social-media scheduling app — the WHOLE all-in-one image
#   (Next.js frontend + NestJS backend + Temporal worker + cron) runs as ONE
#   always-on Fly machine. Domain: social.projectsites.dev → this Fly app.
#   No docker-compose — the official postiz-app image self-supervises its
#   processes from a single entrypoint.
#
#   ⚠️  AGPL / ISOLATION WARNING:
#       Postiz is AGPL-3.0 and runs as an ISOLATED REFERENCE service. The main
#       Worker talks to it over HTTP ONLY (src/services/postiz.ts) — never
#       imports Postiz code, types, or schema. Sunset once native Social
#       (libs/features/social_publishing/) reaches parity.
#
#   Orchestrator:  Temporal Cloud (managed) — namespace social-projectsites.g3erb,
#                  API-key auth + TLS. Postiz REQUIRES Temporal (migrated off
#                  BullMQ); Temporal Cloud is the managed orchestrator, so nothing
#                  Temporal is self-hosted. Search attributes organizationId + postId
#                  are pre-created on the namespace (Postiz skips registering them
#                  when TEMPORAL_TLS=true).
#   Database:      Neon — database "projectsites_postiz" in the SHARED Neon
#                  project (Listmonk pool) per neon-database-conservation.md.
#   Redis:         Upstash Redis (projectsites-postiz, us-east-1) — Postiz cache/pubsub.
#   Storage:       Cloudflare R2 bucket "social-media-assets" via S3-compatible API.
#
# SECRETS (set via `flyctl secrets set KEY=value --app social-postiz`):
#   DATABASE_URL              — Neon connection string (projectsites_postiz)
#   REDIS_URL                 — Upstash Redis URL (rediss://...)
#   JWT_SECRET                — Postiz session signing secret
#   TEMPORAL_API_KEY          — Temporal Cloud API key
#   CLOUDFLARE_ACCOUNT_ID     — R2 account id
#   CLOUDFLARE_ACCESS_KEY     — R2 S3 access key id
#   CLOUDFLARE_SECRET_ACCESS_KEY — R2 S3 secret access key

app            = "social-postiz"
primary_region = "iad"
kill_signal    = "SIGTERM"
kill_timeout   = 30

[build]
  image = "ghcr.io/gitroomhq/postiz-app:latest"

[env]
  NODE_ENV                = "production"
  MAIN_URL                = "https://social.projectsites.dev"
  FRONTEND_URL            = "https://social.projectsites.dev"
  NEXT_PUBLIC_BACKEND_URL = "https://social.projectsites.dev/api"
  BACKEND_INTERNAL_URL    = "http://localhost:3000"
  IS_GENERAL              = "true"
  RUN_CRON                = "true"
  DISABLE_REGISTRATION    = "true"    # admin account provisioned 2026-06-29 (hey@megabyte.space); public self-registration locked
  # --- Temporal Cloud (managed orchestrator) ---
  TEMPORAL_ADDRESS        = "social-projectsites.g3erb.tmprl.cloud:7233"
  TEMPORAL_NAMESPACE      = "social-projectsites.g3erb"
  TEMPORAL_TLS            = "true"
  # --- Cloudflare R2 storage ---
  STORAGE_PROVIDER        = "cloudflare"
  CLOUDFLARE_BUCKETNAME   = "social-media-assets"
  CLOUDFLARE_BUCKET_URL   = "https://pub-4157dd570f0641458b9d4fabad0749d4.r2.dev"
  CLOUDFLARE_REGION       = "auto"
  # --- Email (Resend) — enables password reset, team invites, notifications.
  #     Postiz sends each email via a Temporal workflow, so it needs the worker healthy.
  EMAIL_PROVIDER          = "resend"
  EMAIL_FROM_ADDRESS      = "social@megabyte.space"   # megabyte.space is the verified Resend domain; projectsites.dev is NOT verified there
  EMAIL_FROM_NAME         = "ProjectSites Social"
  # DATABASE_URL, REDIS_URL, JWT_SECRET, TEMPORAL_API_KEY, RESEND_API_KEY,
  # CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_ACCESS_KEY, CLOUDFLARE_SECRET_ACCESS_KEY
  # come from Fly secrets.

[http_service]
  internal_port        = 5000   # Postiz all-in-one Caddy listens on 5000 (backend 3000 internal)
  force_https          = true
  auto_stop_machines   = false  # social scheduler + Temporal worker must be always-on
  auto_start_machines  = true
  min_machines_running = 1

  [http_service.concurrency]
    type       = "connections"
    hard_limit = 200
    soft_limit = 150

# HTTP check on /auth: "/" 307-redirects to /auth, so check the login page itself
# (returns 200). Lives INSIDE http_service so it binds the 5000 port — a bare
# [[services]] block would spin a phantom default-port service.
[[http_service.checks]]
  grace_period = "150s"   # Postiz runs Prisma db push + compiles a workflow bundle per platform queue on first boot
  interval     = "20s"
  timeout      = "15s"    # generous: one all-in-one machine under load; avoid flapping the LB on a transient slow response
  method       = "get"
  path         = "/auth"

# DEDICATED CPU is required, not shared. Postiz runs ~15 Temporal platform
# workers (one per social queue) + Next.js + NestJS in one image. On shared
# cores the workers saturate CPU -> health check flaps -> Fly drops the machine
# from the LB (503) AND Temporal heartbeats time out -> gRPC reconnect storm.
# Dedicated cores break that feedback loop.
[[vm]]
  cpu_kind  = "performance"
  cpus      = 2
  memory_mb = 4096
