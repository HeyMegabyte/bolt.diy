# Fly.io app: telemetry-router
#
# ARCHITECTURE NOTE:
#   Runs an OpenTelemetry Collector receiving OTLP traces/logs/metrics from
#   Cloudflare Workers and routing them to Axiom (logs) + PostHog (analytics).
#
#   DOMAIN: telemetry.projectsites.dev
#     ⚠️  PROTECTED — this endpoint MUST NOT be open to the internet without
#     authentication.  Options:
#       (a) Cloudflare Access (service tokens only) in front of the domain.
#       (b) Collector auth extension with bearer-token verification.
#     Default config in infra/otel/collector.yaml binds to 0.0.0.0 only within
#     Fly's private WireGuard network.  Confirm protection is in place before
#     creating a public DNS record.  See: docs/observability/otel.md
#
#   OTLP gRPC: port 4317 (Fly private networking)
#   OTLP HTTP: port 4318 (Fly private networking)
#   Health:    port 13133 (collector health-check extension)
#
#   Per neon-database-conservation.md: no Postgres/Neon/Upstash needed here.
#   The collector is stateless; all durable storage is in ClickHouse / Axiom.
#
# SECRETS (set via `flyctl secrets set KEY=value --app telemetry-router`):
#   AXIOM_TOKEN              — Axiom API token for log/trace export
#   AXIOM_DATASET            — Axiom dataset (e.g. projectsites-logs)
#   POSTHOG_PROJECT_API_KEY  — PostHog project API key (future PostHog exporter)

app            = "telemetry-router"
primary_region = "iad"
kill_signal    = "SIGTERM"
kill_timeout   = 15

[build]
  image = "otel/opentelemetry-collector-contrib:0.102.0"

[env]
  # Collector config is mounted or embedded in the image.
  # AXIOM_TOKEN, AXIOM_DATASET, POSTHOG_PROJECT_API_KEY come from Fly secrets.

# OTLP gRPC — Fly private networking only; NOT exposed publicly by default
[[services]]
  internal_port        = 4317
  protocol             = "tcp"
  auto_stop_machines   = false
  auto_start_machines  = true
  min_machines_running = 1

  [[services.ports]]
    port = 4317
    # No TLS handlers here — private networking.  Add `handlers = ["tls"]`
    # + a Fly certificate when intentionally exposing gRPC publicly.

# OTLP HTTP — Fly private networking only
[[services]]
  internal_port        = 4318
  protocol             = "tcp"
  auto_stop_machines   = false
  auto_start_machines  = true
  min_machines_running = 1

  [[services.ports]]
    port = 4318

[checks]
  [checks.health]
    grace_period = "10s"
    interval     = "30s"
    method       = "get"
    path         = "/"
    port         = 13133   # otel-collector health_check extension default port
    timeout      = "5s"
    type         = "http"

[[vm]]
  size   = "shared-cpu-1x"
  memory = "256mb"
