name: Plane Deploy (pm.megabyte.space)

# Builds + deploys the single Plane AIO container Worker (apps/project-sites/infra/plane).
# The GitHub runner provides Docker, so wrangler composes the AIO image (6 makeplane/* base
# images → one runner) and pushes it to Cloudflare's container registry as part of deploy.
# No local Docker daemon needed.
#
# Triggers: manual (workflow_dispatch) or push touching the plane infra dir.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/project-sites/infra/plane/**'
      - '.github/workflows/plane-deploy.yaml'

env:
  NODE_VERSION: '20.19.0'

jobs:
  deploy:
    name: Build AIO container + deploy Worker
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: apps/project-sites/infra/plane
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          # repo root has pnpm-workspace.yaml; we only need npx wrangler here, so don't let
          # setup-node auto-enable the pnpm cache (pnpm isn't installed on the runner).
          package-manager-cache: false

      - name: Verify Docker available on runner
        run: docker version

      - name: Install deps (resolves @cloudflare/containers for bundling)
        run: npm install --no-audit --no-fund

      - name: Deploy Worker + build AIO image
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
        # pipefail so a failed wrangler deploy fails the step (a bare `| tee` masks the exit code).
        run: |
          set -o pipefail
          npx --yes wrangler@4 deploy 2>&1 | tee deploy.log

      - name: Set Worker secrets (injected into the Plane container at runtime)
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          SECRET_KEY: ${{ secrets.PLANE_SECRET_KEY }}
          DATABASE_URL: ${{ secrets.PLANE_DATABASE_URL }}
          REDIS_URL: ${{ secrets.PLANE_REDIS_URL }}
          AMQP_URL: ${{ secrets.PLANE_AMQP_URL }}
          S3_ACCESS_KEY_ID: ${{ secrets.PLANE_R2_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.PLANE_R2_SECRET_ACCESS_KEY }}
        run: |
          for n in SECRET_KEY DATABASE_URL REDIS_URL AMQP_URL S3_ACCESS_KEY_ID S3_SECRET_ACCESS_KEY; do
            eval "v=\$$n"
            printf '%s' "$v" | npx --yes wrangler@4 secret put "$n"
          done

      - name: Wake container (apply secrets) + verify
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
        run: |
          echo "Re-deploying so the container picks up the secrets..."
          npx --yes wrangler@4 deploy >/dev/null 2>&1 || true
          # First boot runs DB migrations across the external Neon `plane` DB — give it time.
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://pm.megabyte.space/ || echo 000)
            echo "attempt $i: pm.megabyte.space -> $code"
            [ "$code" = "200" ] && { echo "✓ Plane is serving"; exit 0; }
            sleep 20
          done
          echo "::warning::pm.megabyte.space not 200 yet — container may still be running first-boot migrations; check 'wrangler tail' / container logs."
