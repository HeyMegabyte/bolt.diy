name: Unkey Deploy (api.projectsites.dev)

# Builds + deploys the single Unkey AGPL container Worker (apps/project-sites/infra/unkey).
# The GitHub runner provides Docker (amd64), so wrangler builds the unkeyed/unkey image +
# pushes it to Cloudflare's container registry as part of deploy. No local Docker needed.
#
# Triggers: manual (workflow_dispatch) or push touching the unkey infra dir.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/project-sites/infra/unkey/**'
      - '.github/workflows/unkey-deploy.yaml'

env:
  NODE_VERSION: '22'

jobs:
  deploy:
    name: Build Unkey container + deploy Worker
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: apps/project-sites/infra/unkey
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Verify Docker available on runner
        run: docker version

      - name: Install deps (resolves @cloudflare/containers for bundling)
        run: npm install --no-audit --no-fund

      - name: Deploy Worker + build Unkey image
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
        run: |
          set -o pipefail
          npx --yes wrangler@4 deploy 2>&1 | tee deploy.log

      - name: Set Worker secrets (injected into the Unkey container at runtime)
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          UNKEY_DATABASE_PRIMARY: ${{ secrets.UNKEY_DATABASE_PRIMARY }}
          UNKEY_REDIS_URL: ${{ secrets.UNKEY_REDIS_URL }}
          UNKEY_ROOT_KEY: ${{ secrets.UNKEY_ROOT_KEY }}
        run: |
          for n in UNKEY_DATABASE_PRIMARY UNKEY_REDIS_URL UNKEY_ROOT_KEY; do
            eval "v=\$$n"
            printf '%s' "$v" | npx --yes wrangler@4 secret put "$n"
          done

      - name: Wake container (apply secrets) + verify liveness
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
        run: |
          echo "Re-deploying so the container picks up the secrets..."
          npx --yes wrangler@4 deploy >/dev/null 2>&1 || true
          # First boot runs DB migrations against the external TiDB `unkey` db — give it time.
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://api.projectsites.dev/v2/liveness || echo 000)
            echo "attempt $i: api.projectsites.dev/v2/liveness -> $code"
            [ "$code" = "200" ] && { echo "✓ Unkey is serving"; exit 0; }
            sleep 20
          done
          echo "::warning::api.projectsites.dev/v2/liveness not 200 yet — container may still be running first-boot migrations; check container state."
